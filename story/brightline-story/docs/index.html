.gn-tree h6{font-size:var(--gn-type-label); color:var(--gn-text-caption); letter-spacing:.04em; text-transform:uppercase; font-weight:400; padding:16px 12px 8px}
/* reference navigation: method and path in a grid, groups by object */
.gn-ref{display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr); gap:48px; margin-top:32px; align-items:start}
.gn-ref--3{grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,320px); gap:40px}
.gn-ref-n{position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; scrollbar-width:thin}
.gn-ref-n a{display:grid; grid-template-columns:44px minmax(0,1fr); gap:8px; padding:8px 12px; border-radius:var(--gn-radius-part); font-size:var(--gn-type-label); cursor:pointer; color:var(--gn-text-secondary)}
.gn-ref-n a:hover{background:var(--gn-bg-hover)} .gn-ref-n a.is-on{background:var(--gn-bg-selected); color:var(--gn-interactive)}
.gn-ref-n a.is-topic{display:block; font-size:var(--gn-type-body); padding:8px 12px}
.gn-ref-n .gn-method{font-family:var(--gn-font-mono)} .gn-ref-n .gn-path{font-family:var(--gn-font-mono); overflow-wrap:break-word}
.gn-ref-c{position:sticky; top:16px}
.gn-ref-c .gn-label{display:block; margin:16px 0 8px}
@media (max-width:1000px){ .gn-ref,.gn-ref--3{grid-template-columns:1fr; gap:24px} .gn-ref-n,.gn-ref-c{position:static; max-height:none} }
/* frames: one moment seen from two or three portals at once */
.gn-frames{display:grid; gap:24px; margin-top:32px; align-items:start; grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.gn-frame{background:var(--gn-bg-tone); border-radius:var(--gn-radius-surface); min-width:0; overflow:hidden}
.gn-frame-h{display:flex; align-items:baseline; gap:16px; padding:12px 20px; background:var(--gn-brand-base-light); border-bottom:1px solid var(--gn-rule-strong); font-size:var(--gn-type-label)}
.gn-frame-h b{font-weight:600; white-space:nowrap} .gn-frame-h span{color:var(--gn-text-caption); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0} .gn-frame-h span:last-child{margin-left:auto}
.gn-frame-b{padding:0 20px 20px}
.gn-frame .gn-section{margin-top:24px} .gn-frame .gn-section h2{font-size:var(--gn-type-body)}
.gn-frame .gn-row{padding:12px 0} .gn-frame .gn-empty{background:var(--gn-bg-page)}
.gn-frame .gn-figs{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 24px} .gn-frame .gn-fig b{font-size:var(--gn-type-subhead)}
@media (max-width:1100px){ .gn-frames{grid-template-columns:1fr} }

/* ── 17 · marketing: the same language at a larger scale ─────────────── */
.gn-site{max-width:1240px; margin:0 auto; padding:0 40px}
.gn-topnav{display:flex; align-items:center; gap:40px; padding:24px 0 0}
.gn-topnav .gn-sidebar-mark{padding:0; font-size:var(--gn-type-body)}
.gn-topnav-l{display:flex; gap:24px; font-size:var(--gn-type-body); color:var(--gn-text-secondary)}
.gn-topnav-l a{cursor:pointer} .gn-topnav-l a:hover{color:var(--gn-text)} .gn-topnav-l a.is-on{color:var(--gn-interactive); text-decoration:underline; text-underline-offset:8px; text-decoration-thickness:1px}
.gn-topnav-r{margin-left:auto; display:flex; gap:16px; align-items:center}
.gn-band{padding:var(--gn-band) 0}
.gn-band--ink{background:var(--gn-bg-ink); color:#fff}
.gn-band--tone{background:var(--gn-bg-tone)}
.gn-band .gn-eyebrow{margin-bottom:16px}
.gn-band--ink .gn-eyebrow{color:var(--gn-brand-burst-light)}
.gn-band h2{font-size:var(--gn-type-title); letter-spacing:var(--gn-tracking-title); line-height:var(--gn-leading-title); max-width:18ch}
.gn-band h2 .gn-mute{color:var(--gn-text-caption)} .gn-band--ink h2 .gn-mute{color:rgba(255,255,255,.5)}
.gn-band .gn-lede{margin-top:20px}
.gn-band--ink .gn-lede{color:rgba(255,255,255,.72)}
.gn-hero h1{font-size:var(--gn-type-display); letter-spacing:var(--gn-tracking-display); line-height:var(--gn-leading-display); max-width:14ch}
.gn-hero .gn-lede{margin-top:24px; color:var(--gn-text-secondary)}
.gn-hero .gn-actions{margin-top:32px}
.gn-band-figs{display:grid; grid-template-columns:repeat(4,1fr); gap:28px; margin-top:56px; padding:32px 0; border-top:1px solid var(--gn-rule-strong); border-bottom:1px solid var(--gn-rule-strong)}
.gn-band-figs .gn-fig b{font-size:var(--gn-type-heading)}
.gn-band-figs .gn-fig span{font-size:var(--gn-type-body); margin-top:4px}
.gn-marketing-fig{font-size:var(--gn-type-display); letter-spacing:-.04em; line-height:1; font-weight:600}
.gn-marketing-fig small{font-size:var(--gn-type-subhead); letter-spacing:var(--gn-tracking-subhead); color:var(--gn-text-caption); margin-left:8px; font-weight:400}
.gn-band--ink .gn-marketing-fig small{color:rgba(255,255,255,.5)}
@media (max-width:900px){ .gn-band{padding:48px 0} .gn-band-figs{grid-template-columns:repeat(2,1fr)} .gn-hero h1{font-size:var(--gn-type-title)} .gn-site{padding:0 24px} }

/* ── 18 · the product header, and what hangs off it ──────────────────── */
/* one bar across every portal: the mark and portal, the organisation and its
   state, search, what needs the reader, help, the person. The sidebar under it
   carries navigation only. */
.gn-header{position:sticky; top:0; z-index:30; height:56px; background:var(--gn-bg-page); border-bottom:1px solid var(--gn-rule-strong); display:flex; align-items:center; gap:24px; padding:0 24px}
.gn-header--static{position:relative}
.gn-header-m{display:flex; align-items:center; gap:12px; font-size:var(--gn-type-body); font-weight:600; color:var(--gn-text); cursor:pointer; white-space:nowrap}
.gn-header-m i{width:24px; height:24px; border-radius:var(--gn-radius-small); background:var(--gn-brand-primary); color:#fff; display:grid; place-items:center; font-size:var(--gn-type-label); font-weight:600; flex:none}
.gn-header-org{display:flex; align-items:center; gap:8px; font-size:var(--gn-type-body); color:var(--gn-text-secondary); white-space:nowrap; padding-left:24px; border-left:1px solid var(--gn-rule-strong); height:24px}
.gn-header-org b{font-weight:400; color:var(--gn-text)}
.gn-header-q{flex:1; display:flex; justify-content:center; min-width:0}
.gn-header-q form{position:relative; width:min(420px,100%)}
.gn-header-q .gn-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--gn-text-quiet); pointer-events:none}
.gn-header-q input{width:100%; height:36px; padding:0 44px 0 36px; font:inherit; font-size:var(--gn-type-body); color:var(--gn-text); background:var(--gn-bg-tone); border:1px solid transparent; border-radius:var(--gn-radius-part); outline:none}
.gn-header-q input::placeholder{color:var(--gn-text-quiet)}
.gn-header-q input:focus{background:var(--gn-bg-page); border-color:var(--gn-focus); box-shadow:0 0 0 3px var(--gn-focus-halo)}
.gn-header-q kbd{position:absolute; right:8px; top:8px; height:20px; padding:0 8px; font-family:inherit; font-size:var(--gn-type-label); line-height:18px; color:var(--gn-text-caption); border:1px solid var(--gn-outline); border-radius:var(--gn-radius-small); background:var(--gn-bg-page)}
.gn-header-r{display:flex; align-items:center; gap:4px; margin-left:auto}
.gn-header-a{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:var(--gn-radius-part); font-size:var(--gn-type-body); color:var(--gn-text-secondary); cursor:pointer; white-space:nowrap; position:relative}
.gn-header-a:hover{background:var(--gn-bg-hover); color:var(--gn-text)}
.gn-header-a.is-on{color:var(--gn-interactive)}
.gn-header-a .gn-icon{width:18px; height:18px; stroke-width:1.6}
.gn-header-a .gn-count{font-size:var(--gn-type-label); color:var(--gn-text-caption)}
.gn-header-a.needs .gn-count{color:var(--gn-signal)}
.gn-header-u{display:flex; align-items:center; gap:12px; height:40px; padding:0 8px 0 4px; margin-left:12px; border-radius:var(--gn-radius-part); cursor:pointer; position:relative}
.gn-header-u:hover{background:var(--gn-bg-hover)}
.gn-header-u .gn-name{font-size:var(--gn-type-body); line-height:1.2; white-space:nowrap}
.gn-header-u .gn-name span{display:block; font-size:var(--gn-type-label); color:var(--gn-text-caption)}
.gn-header-u .gn-icon--sm{color:var(--gn-text-quiet)}
.gn-header .gn-menu-panel{top:calc(100% + 4px); min-width:220px}
.gn-header--nonav .gn-header-q,.gn-header--nonav .gn-header-a{display:none}
.gn-app--header{flex-direction:column}
.gn-app--header .gn-app-b{display:flex; flex:1}
.gn-app--header .gn-sidebar{top:56px; height:calc(100vh - 56px); padding-top:20px}
@media (max-width:1100px){ .gn-header-a .gn-lb{display:none} .gn-header-q form{width:min(280px,100%)} }
@media (max-width:760px){ .gn-header{padding:0 16px; gap:16px} .gn-header-org,.gn-header-q{display:none} .gn-header-u .gn-name{display:none} }
/* the notification centre: what needs you, under the header's count */
.gn-notifs{width:400px; max-width:92vw; overflow:hidden}
.gn-notifs--fixed{position:absolute; right:0; top:calc(100% + 4px); z-index:31}
.gn-notifs-h{display:flex; align-items:baseline; gap:16px; padding:16px 20px 12px; border-bottom:1px solid var(--gn-rule-strong)}
.gn-notifs-h b{font-weight:600} .gn-notifs-h span{font-size:var(--gn-type-label); color:var(--gn-text-caption)} .gn-notifs-h .gn-link{margin-left:auto; font-size:var(--gn-type-label)}
.gn-notifs-l{max-height:440px; overflow-y:auto}
.gn-notifs .gn-eyebrow{padding:12px 20px 4px}
.gn-notif{display:grid; grid-template-columns:8px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 20px; border-bottom:1px solid var(--gn-rule); cursor:pointer}
.gn-notif:hover{background:var(--gn-bg-hover)}
.gn-notif i{width:8px; height:8px; border-radius:50%; background:var(--gn-outline); margin-top:6px}
.gn-notif.is-new i{background:var(--gn-signal)}
.gn-notif b{display:block; font-weight:400; font-size:var(--gn-type-body)} .gn-notif.is-new b{font-weight:600}
.gn-notif span{display:block; font-size:var(--gn-type-label); color:var(--gn-text-caption); margin-top:2px}
.gn-notif .gn-num{white-space:nowrap}
.gn-notif .gn-actions{margin-top:8px; gap:12px}
.gn-notifs-f{padding:12px 20px; border-top:1px solid var(--gn-rule-strong); font-size:var(--gn-type-label); text-align:center}
/* banner: a line across the top of the product, under the header, for something everyone must know */
.gn-banner{display:flex; align-items:center; gap:16px; padding:12px 24px; background:var(--gn-bg-selected); font-size:var(--gn-type-body); color:var(--gn-text)}
.gn-banner b{font-weight:600; color:var(--gn-interactive)}
.gn-banner.is-warn{background:var(--gn-warn-tint)} .gn-banner.is-warn b{color:var(--gn-warn)}
.gn-banner.is-bad{background:#F9E6E3} .gn-banner.is-bad b{color:var(--gn-bad)}
.gn-banner.is-good{background:var(--gn-good-tint)} .gn-banner.is-good b{color:var(--gn-good)}
.gn-banner .gn-link{white-space:nowrap}
.gn-banner .gn-x{margin-left:auto; width:28px; height:28px; display:grid; place-items:center; border-radius:var(--gn-radius-small); color:var(--gn-text-secondary); cursor:pointer}
.gn-banner .gn-x:hover{background:rgba(0,2,38,.06)}
/* counts: a number beside a word, never a pill */
.gn-count{font-size:var(--gn-type-label); color:var(--gn-text-caption); font-variant-numeric:tabular-nums}
.gn-count.needs{color:var(--gn-signal)}

/* ── 19 · cards that carry a chart, an insight, or a finding ─────────── */
/* chart card: an instrument in a surface. The figure, its comparison, the chart. */
.gn-chartcard{padding:20px 24px; background:var(--gn-bg-tone); border-radius:var(--gn-radius-surface); min-width:0}
.gn-chartcard .gn-chart-h{margin-bottom:4px}
.gn-chartcard .gn-chart{margin-top:8px}
.gn-chartcard-f{display:flex; gap:16px; align-items:baseline; margin-top:12px; font-size:var(--gn-type-label); color:var(--gn-text-caption)}
.gn-chartcard-f .gn-link{margin-left:auto}
.gn-chartcards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:24px}
.gn-chartcards--3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* insight: a finding in one sentence, why, and one action. Marked on the left by what it means. */
.gn-insight{padding:20px 24px; background:var(--gn-bg-tone); border-radius:var(--gn-radius-surface); position:relative; padding-left:28px}
.gn-insight::before{content:""; position:absolute; left:0; top:20px; bottom:20px; width:3px; border-radius:0 2px 2px 0; background:var(--gn-interactive)}
.gn-insight.is-warn::before{background:var(--gn-warn)} .gn-insight.is-bad::before{background:var(--gn-bad)} .gn-insight.is-good::before{background:var(--gn-good)}
.gn-insight-h{display:flex; align-items:baseline; gap:16px}
.gn-insight-h b{font-weight:600; font-size:var(--gn-type-body)} .gn-insight-h .gn-status{margin-left:auto}
.gn-insight p{font-size:var(--gn-type-body); color:var(--gn-text-secondary); margin-top:4px; line-height:1.5; max-width:var(--gn-measure-body)}
.gn-insight .gn-figs{margin-top:12px; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 24px}
.gn-insight .gn-fig b{font-size:var(--gn-type-subhead)}
.gn-insight .gn-actions{margin-top:12px}
.gn-insights{display:grid; gap:12px; margin-top:16px}
.gn-insights--2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){ .gn-chartcards,.gn-chartcards--3,.gn-insights--2{grid-template-columns:1fr} }

/* ── 20 · modal: one task that must not leave the page ───────────────── */
.gn-modal{width:640px; max-width:92vw; max-height:90vh; display:flex; flex-direction:column; overflow:hidden}
.gn-modal--fixed{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:30}
.gn-modal-h{display:flex; align-items:center; gap:16px; padding:20px 28px 0}
.gn-modal-h h2{font-size:var(--gn-type-subhead); letter-spacing:var(--gn-tracking-subhead)}
.gn-modal-h .gn-panel-x{margin-left:auto}
.gn-modal-b{padding:0 28px 24px; overflow-y:auto}
.gn-modal-b > p{color:var(--gn-text-secondary); margin-top:8px}
.gn-modal-b .gn-field:first-of-type{margin-top:20px}
.gn-modal-f{border-top:1px solid var(--gn-rule-strong); padding:16px 28px; display:flex; gap:8px; justify-content:flex-end; align-items:center}
.gn-modal-f .gn-link{margin-right:auto}

/* ── 21 · data lists and split panes ─────────────────────────────────── */
/* a description list with a label column: for a record read down, with an action per row */
.gn-dl{font-size:var(--gn-type-body)}
.gn-dl-r{display:grid; grid-template-columns:200px minmax(0,1fr) auto; gap:24px; padding:12px 0; border-bottom:1px solid var(--gn-rule); align-items:baseline}
.gn-dl-r .gn-doc-l{font-size:var(--gn-type-body); color:var(--gn-text-caption)}
.gn-dl-r .gn-doc-p{display:block; margin-top:2px}
.gn-dl-r .gn-link{font-size:var(--gn-type-label); white-space:nowrap}
.gn-dl--compact .gn-dl-r{grid-template-columns:140px minmax(0,1fr) auto; padding:8px 0}
/* split panes with headers: a list pane and a detail pane on one rule */
.gn-panes{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); border:1px solid var(--gn-rule-strong); border-radius:var(--gn-radius-surface); overflow:hidden; min-height:420px}
.gn-panes--3{grid-template-columns:220px minmax(0,1fr) minmax(0,1.2fr)}
.gn-pane{min-width:0; display:flex; flex-direction:column; border-left:1px solid var(--gn-rule-strong)}
.gn-pane:first-child{border-left:0}
.gn-pane-h{display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--gn-rule-strong); font-size:var(--gn-type-body); min-height:48px}
.gn-pane-h b{font-weight:600} .gn-pane-h .gn-count{margin-left:4px} .gn-pane-h .gn-link,.gn-pane-h .gn-btn{margin-left:auto}
.gn-pane-b{flex:1; overflow:auto; min-height:0}
.gn-pane-b .gn-row{padding:12px 20px} .gn-pane-b .gn-rows{border-top:0}
.gn-pane-b .gn-doc{padding:16px 20px}
.gn-pane-b > .gn-section{margin:16px 20px 0}
.gn-pane--tone{background:var(--gn-bg-tone)}
.gn-pane-b .gn-code{margin:16px 20px; padding:12px 16px}
@media (max-width:900px){ .gn-panes,.gn-panes--3{grid-template-columns:1fr} .gn-pane{border-left:0; border-top:1px solid var(--gn-rule-strong)} .gn-pane:first-child{border-top:0} .gn-dl-r{grid-template-columns:1fr} }

/* ── 22 · more instruments: area, waterfall, histogram, stacked, multi-series, small ── */
.gn-chart .a2{fill:var(--gn-chart-2); opacity:.12}
.gn-chart .w{fill:var(--gn-chart-2)} .gn-chart .w.neg{fill:var(--gn-chart-3)} .gn-chart .w.tot{fill:var(--gn-interactive)}
.gn-chart .wl{font-size:13px; fill:var(--gn-text)} .gn-chart .wc{stroke:var(--gn-outline); stroke-width:1; stroke-dasharray:2 3}
.gn-chart .h{fill:var(--gn-outline)} .gn-chart .h.on{fill:var(--gn-interactive)} .gn-chart .h.tail{fill:var(--gn-chart-3)}
.gn-chart .hm{stroke:var(--gn-text); stroke-width:1; stroke-dasharray:3 3}
.gn-chart rect.s1{fill:var(--gn-interactive)} .gn-chart rect.s2{fill:var(--gn-chart-2)} .gn-chart rect.s3{fill:var(--gn-chart-3)}
.gn-chart-key i.f1{border:0; height:10px; width:10px; background:var(--gn-interactive); border-radius:2px} .gn-chart-key i.f2{border:0; height:10px; width:10px; background:var(--gn-chart-2); border-radius:2px} .gn-chart-key i.f3{border:0; height:10px; width:10px; background:var(--gn-chart-3); border-radius:2px}
/* small multiples: a week of activity, or two values compared, in a row or a card */
.gn-week{display:inline-flex; gap:4px; align-items:flex-end; height:28px}
.gn-week i{display:block; width:8px; background:var(--gn-outline); border-radius:2px; height:var(--h,20%)}
.gn-week i.on{background:var(--gn-interactive)}
.gn-compare{display:grid; grid-template-columns:120px minmax(0,1fr) 72px; gap:12px; align-items:center; padding:8px 0; font-size:var(--gn-type-body)}
.gn-compare .gn-bar{height:10px}
.gn-compare .gn-bar i.s2{background:var(--gn-chart-2)}
.gn-compare .gn-num{text-align:right}

/* ── 23 · badges and tags: the dense-screen shorthand ─────────────────
   Brought in on September 6, 2026 to take text out of dense screens. A badge
   is a status word with a tint behind it, for a cell or a card head where
   the word alone is lost. A tag is a category in a quiet box. Neither is
   the default: a status word or a line is. Never more than one badge per
   row, never a badge in the signal colour. */
.gn-badge{display:inline-flex; align-items:center; gap:8px; height:22px; padding:0 8px; border-radius:var(--gn-radius-small); font-size:var(--gn-type-label); line-height:1; white-space:nowrap; background:var(--gn-gray-100); color:var(--gn-text-secondary)}
.gn-badge.is-good{background:var(--gn-good-tint); color:var(--gn-good)}
.gn-badge.is-warn{background:var(--gn-warn-tint); color:var(--gn-warn)}
.gn-badge.is-bad{background:#F9E6E3; color:var(--gn-bad)}
.gn-badge.is-info{background:var(--gn-bg-selected); color:var(--gn-interactive)}
.gn-badge.is-ink{background:var(--gn-text); color:#fff}
.gn-badge i{width:6px; height:6px; border-radius:50%; background:currentColor}
.gn-badge--dot{padding:0; height:auto; background:none!important}
.gn-badge--dot i{width:8px; height:8px}
.gn-tag{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:var(--gn-radius-small); font-size:var(--gn-type-label); line-height:1; white-space:nowrap; border:1px solid var(--gn-rule-strong); color:var(--gn-text-secondary); background:var(--gn-bg-page)}
.gn-tag.is-on{border-color:var(--gn-interactive); color:var(--gn-interactive)}
.gn-tags{display:inline-flex; gap:8px; flex-wrap:wrap}
.gn-row-t .gn-tags{display:inline-flex; margin-top:8px} .gn-row-t .gn-tag{display:inline-flex; margin-top:0; color:var(--gn-text-secondary)}
/* chart text the library draws */
.gn-chart .dc{font-size:22px; font-weight:600; fill:var(--gn-text); letter-spacing:-.015em}
.gn-chart .gv{font-size:28px; font-weight:600; fill:var(--gn-text); letter-spacing:-.02em}
.gn-chart .tl{font-size:13px; fill:#fff; font-weight:600} .gn-chart .tv{font-size:13px; fill:rgba(255,255,255,.8)}
.gn-chart .dn{transition:opacity .12s ease} .gn-chart .dn:hover{opacity:.8}
.gn-chart--sm{max-width:360px} .gn-chart--gauge{max-width:240px}
.gn-chart-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 32px; margin-top:16px}
.gn-chart-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){ .gn-chart-grid,.gn-chart-grid--3{grid-template-columns:1fr} }

/* ── 24 · the chart library, second pass: tooltips, toggles, rings, KPI cards, loading ── */
.gn-chart-tip{position:absolute; z-index:40; pointer-events:none; background:var(--gn-text); color:#fff; font-size:var(--gn-type-label); line-height:1.5; padding:8px 12px; border-radius:var(--gn-radius-small); white-space:nowrap; box-shadow:var(--gn-shadow-menu)}
.gn-chart-tip b{display:block; font-weight:600; margin-bottom:2px}
.gn-chart-tip i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px; vertical-align:middle}
.gn-chart-tip .sep{display:inline-block; width:12px}
.gn-chart .hl{stroke:var(--gn-text); stroke-width:1; stroke-dasharray:3 3}
.gn-chart g.series{transition:opacity .16s ease} .gn-chart g.series.is-off{opacity:.12}
.gn-chart-key.is-toggles span{cursor:pointer} .gn-chart-key span.is-off{opacity:.4; text-decoration:line-through}
.gn-chart .rv{font-size:13px; fill:var(--gn-text); font-weight:600}
.gn-ring{display:block}
.gn-rings{display:grid; gap:0}
.gn-rings-r{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:16px; align-items:center; padding:8px 0; border-bottom:1px solid var(--gn-rule); font-size:var(--gn-type-body)}
.gn-rings-r b{display:block; font-weight:400} .gn-rings-r > span:nth-child(2) span{display:block; font-size:var(--gn-type-label); color:var(--gn-text-caption)}
/* a change, with its direction */
.gn-delta{display:inline-flex; align-items:center; gap:4px; font-size:var(--gn-type-label); white-space:nowrap}
.gn-delta svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.gn-delta.is-good{color:var(--gn-good)} .gn-delta.is-bad{color:var(--gn-bad)} .gn-delta.is-quiet{color:var(--gn-text-caption)}
/* KPI cards: a number with one supporting visual */
.gn-kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-top:24px}
.gn-kpis--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gn-kpi{padding:20px 24px; background:var(--gn-bg-tone); border-radius:var(--gn-radius-surface); display:flex; flex-direction:column; gap:8px; min-width:0}
.gn-kpi-l{font-size:var(--gn-type-label); color:var(--gn-text-caption); display:flex; justify-content:space-between; gap:12px}
.gn-kpi-v{font-size:var(--gn-type-heading); letter-spacing:var(--gn-tracking-heading); font-weight:600; line-height:1; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.gn-kpi-v small{font-size:var(--gn-type-label); color:var(--gn-text-caption); font-weight:400; letter-spacing:0}
.gn-kpi-s{font-size:var(--gn-type-label); color:var(--gn-text-caption); display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.gn-kpi .gn-spark{margin-top:4px; width:100%; height:32px}
.gn-kpi--ring{display:grid; grid-template-columns:64px minmax(0,1fr); gap:16px; align-items:center}
.gn-kpi--ring .gn-kpi-v{font-size:var(--gn-type-subhead)}
.gn-kpi--marked{border-left:3px solid var(--gn-interactive); border-radius:0 var(--gn-radius-surface) var(--gn-radius-surface) 0}
.gn-kpi--marked.is-good{border-color:var(--gn-good)} .gn-kpi--marked.is-warn{border-color:var(--gn-warn)} .gn-kpi--marked.is-bad{border-color:var(--gn-bad)}
.gn-kpi--compact{padding:12px 16px; gap:4px} .gn-kpi--compact .gn-kpi-v{font-size:var(--gn-type-subhead)}
.gn-kpi .gn-bar{margin-top:4px}
@media (max-width:1100px){ .gn-kpis,.gn-kpis--3{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* loading: the bar that does not know, and the spinner */
.gn-bar--indeterminate i{width:30%; animation:gn-indet 1.4s ease-in-out infinite}
@keyframes gn-indet{0%{margin-left:-30%} 100%{margin-left:100%}}
.gn-bar--lg{height:12px} .gn-bar--sm{height:4px}
.gn-bar i.is-good{background:var(--gn-good)} .gn-bar i.is-warn{background:var(--gn-warn)}
.gn-bar-l{display:flex; justify-content:space-between; font-size:var(--gn-type-label); color:var(--gn-text-caption); margin-bottom:8px}
.gn-spinner{display:inline-block; width:20px; height:20px; border:2px solid var(--gn-track); border-top-color:var(--gn-interactive); border-radius:50%; animation:gn-spin .8s linear infinite; vertical-align:middle}
.gn-spinner--sm{width:14px; height:14px; border-width:2px} .gn-spinner--lg{width:32px; height:32px; border-width:3px}
.gn-spinner--ink{border-color:rgba(255,255,255,.25); border-top-color:#fff}
@keyframes gn-spin{to{transform:rotate(360deg)}}
.gn-spinner-l{display:inline-flex; align-items:center; gap:12px; font-size:var(--gn-type-body); color:var(--gn-text-secondary)}
@media (prefers-reduced-motion:reduce){ .gn-spinner{animation:none; border-top-color:var(--gn-track)} .gn-bar--indeterminate i{animation:none; width:100%; margin:0; opacity:.5} }
/* vertical stepper: a pipeline read down */
.gn-stepper--v{display:flex; flex-direction:column; gap:0; grid-template-columns:none; margin-top:16px}
.gn-stepper--v li{flex-direction:row; align-items:flex-start; text-align:left; gap:16px; padding:0 0 24px; font-size:var(--gn-type-body); color:var(--gn-text-secondary)}
.gn-stepper--v li::before{top:28px; left:13px; width:1px; height:calc(100% - 28px); background:var(--gn-rule-strong)}
.gn-stepper--v li:last-child::before{display:none} .gn-stepper--v li:first-child::before{display:block}
.gn-stepper--v li.is-done::before{background:var(--gn-brand-primary)} .gn-stepper--v li.is-cur::before{background:var(--gn-rule-strong)}
.gn-stepper--v li b{display:block; font-weight:600; color:var(--gn-text)} .gn-stepper--v li.is-cur b{color:var(--gn-text)}
.gn-stepper--v li span{display:block} .gn-stepper--v li span.gn-spinner{display:inline-block} .gn-stepper--v li .gn-spinner-l{display:inline-flex; margin-top:4px} .gn-stepper--v li em{display:block; font-size:var(--gn-type-label); color:var(--gn-text-caption); margin-top:2px}
.gn-stepper--v li.is-cur{font-weight:400}
/* skeleton variants */
.gn-skel--avatar{width:36px; height:36px; border-radius:50%}
.gn-skel-card{padding:20px 24px; background:var(--gn-bg-tone); border-radius:var(--gn-radius-surface)}
/* a colour strip for the anatomy section on chart pages */
.gn-color-strip{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px}
.gn-color-strip span{display:inline-flex; align-items:center; gap:8px; font-size:var(--gn-type-label); color:var(--gn-text-caption)}
.gn-color-strip i{width:20px; height:20px; border-radius:var(--gn-radius-small)}

/* =====================================================================
   Global Payment Network prototype system — encoded from the Partner Desk brief, Sep 2026
   Register: Ramp × Mercury. One weight. Tone, not lines. One signal colour.
   Rules of use are in the comments; if a part isn't here, don't invent it.
   ===================================================================== */

:root{
  /* ── the brand, Sep 2026 ───────────────────────────────────────────
     Primary #230762 · Burst Dark #3144B7 · Burst Light #9EAAFC
     Base Dark #000226 · Base Light #F2F2F9 · Heritage #FE6200        */
  --primary:#230762;      /* brand mark, structural fill, selected text */
  --burst:#3144B7;        /* interactive: links, chart line, focus     */
  --burst-lt:#9EAAFC;     /* on ink, and the emphatic tint             */
  --base-dk:#000226;      /* the ink ground                            */
  --base-lt:#F2F2F9;      /* the tone ground                           */
  --sig:#FE6200;          /* Heritage. Primary action + needs-you mark */

  --white:#FFFFFF;
  /* two backgrounds, white and one tone — g025 and g050 stay collapsed */
  --g025:#F2F2F9; --g050:#F2F2F9;
  /* the ramp is derived from Base Dark to Base Light at the luminance the
     warm ramp had, so contrast and hierarchy survive the re-tone */
  --g100:#E6E7ED; --g150:#DDDDE3; --g200:#CCCCD3;
  --g400:#919199; --g550:#696A75; --g650:#525362; --g900:#151738;

  /* structure. --navy is kept as the name the whole system already uses;
     it now carries Burst Dark, because Primary at 14.7:1 on the tone reads
     as body text rather than as something you can click. */
  --navy:#3144B7;
  --blue100:#E5E6F9;      /* selected row, active nav, current stage   */
  --blue050:#F1F1FB;

  /* semantics: coloured words, never pills. Re-tuned for the cool grounds. */
  --good:#3F7A33; --warn:#8A6A15; --bad:#C0392B;
  /* the same three, legible on ink */
  --good-ink:#7FC26B; --warn-ink:#E3B950; --bad-ink:#F08D7E;

  /* chart hues: inside charts only, and only with more than one series */
  --c1:#3144B7; --c2:#6E7CD9; --c3:#B29B24; --c4:#7A4FA8; --c5:#3F7A33;
  /* on the ink ground */
  --ink-land:#141636; --ink-mark:#9EAAFC;

  --ui:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-surface:12px; --r-part:8px; --r-small:6px;
  --sbw:0px; --vw:calc(100vw - var(--sbw));
  --top-h:56px;           /* the product header */
}

*{box-sizing:border-box}
html{scrollbar-gutter:stable; overflow-x:clip}
body{margin:0; background:var(--white); color:var(--g900); font-family:var(--ui); font-size:15px; line-height:1.45; font-weight:400; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
h1,h2,h3,h4,h5,h6,p{margin:0}
/* ── weight ───────────────────────────────────────────────────────────
   Two weights in play, and each has a job. **600 marks headings and the
   figures that carry an argument.** **400 is everything else** — body,
   labels, captions, values, table cells, status words.

   The system ran on one weight until September 2026, when Rich opened it
   up: all four Proxima cuts are licensed. This is not that unlock taken
   literally. 300 stays unused, because Light at 13 and 15px loses on
   these grounds. 700 stays unused, because 600 already separates a
   heading from its body and a second step buys nothing.

   Two rules survive from the one-weight era and are the reason it worked:
   `th` stays 400, because a table header is a quiet label rather than a
   heading; and emphasis inside a paragraph is carried by **tone**, never
   by weight, which is why `b` and `strong` are still reset. */
h1,h2,h3,h4,h5,h6{font-weight:600}
b,strong,th{font-weight:400}
/* figures argue, so they take the heading weight */
.bignum,.cw-n,.b4-n,.rf .f,.reach .f,.out .v,.tr-ms,.sz label b,.cf b,
.inst .hd b,.band .v,.facts .v,.dc-out .o .st,.art-hd b{font-weight:600}
i{font-style:normal} /* <i> is a decorative span here, never italic text */
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--navy); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* ---- type: five sizes, one weight. Hierarchy from size only. ---- */
.t40{font-size:40px; letter-spacing:-.025em; line-height:1.05}
.t28{font-size:28px; letter-spacing:-.02em; line-height:1.15}
.t22{font-size:22px; letter-spacing:-.015em}
.t15{font-size:15px}
.t13{font-size:13px; color:var(--g550)}
.mute{color:var(--g550)}

/* ---- status: coloured words ---- */
.st{white-space:nowrap}
.st.ok{color:var(--good)} .st.wa{color:var(--warn)} .st.no{color:var(--bad)} .st.nt{color:var(--g550)}

/* ---- actions: one solid button per screen ---- */
/* fixed heights on the grid: a filled button and an outlined one beside it
   must be the same box, and fractional heights render differently */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-left:8px}
.chip{display:inline-flex; align-items:center; gap:8px; font-size:13px; padding:8px 12px; border-radius:999px; background:var(--g050); color:var(--g650); cursor:pointer}
.chip.on{background:var(--blue100); color:var(--navy)}

/* ---- surfaces: three steps of tone, no borders, no shadows ---- */
.surface{background:var(--g025); border-radius:var(--r-surface); padding:24px 28px}
.surface.deep{background:var(--g050)}
.surface.marked{position:relative}
.surface.marked::before{content:""; position:absolute; left:0; top:24px; bottom:24px; width:3px; background:var(--sig); border-radius:0 2px 2px 0}
.floating{background:#fff; border-radius:var(--r-surface); box-shadow:0 12px 40px rgba(0,2,38,.14)} /* only for things that float: slide-over, dialog, toast */

/* ---- sections: title, rule, words as actions ---- */
.sec{margin-top:36px}
.sec .hd{display:flex; align-items:baseline; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--g150)}
.sec .hd h2{font-size:22px; letter-spacing:-.015em}
.sec .hd .ct{font-size:15px; color:var(--g550)}
.sec .hd .rt{margin-left:auto; display:flex; gap:20px; font-size:15px}
.row{display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; padding:16px 0; border-bottom:1px solid var(--g100)}
.row .d{font-size:13px; color:var(--g550); margin-top:4px}

/* ---- table: 64px rows, two lines per cell, hairlines inside only ---- */
.tb{width:100%; border-collapse:collapse; font-size:15px}
.tb th{text-align:left; font-weight:400; font-size:13px; color:var(--g550); padding:8px 16px 12px; border-bottom:1px solid var(--g150); white-space:nowrap}
.tb td{padding:16px 16px; border-bottom:1px solid var(--g100); vertical-align:middle; height:64px}
.tb .n{text-align:right}
.tb tbody tr:not(.sel):not(.sel2):not(.expand):hover td{background:var(--g050)}
.tb tr.sel td{background:var(--blue100); color:var(--navy)}
.tb tr.sel .s2{color:var(--navy)}
.tb tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--navy)} /* flagged, not the accent: orange is the button and the brief's marker only */
.tb .nw{white-space:nowrap}
.tb .s2{overflow-wrap:anywhere; display:block; font-size:13px; color:var(--g550); margin-top:4px}
.tb td .st{white-space:nowrap}
.tb td.st.ok{color:var(--good)} .tb td.st.wa{color:var(--warn)} .tb td.st.no{color:var(--bad)}
/* columns a narrow window can lose without losing the point of the table */
@media (max-width:1180px){ .tb .opt2{display:none} }
@media (max-width:980px){ .tb .opt{display:none} }
@media (max-width:760px){ .tb th, .tb td{padding:12px 8px} .tb td{height:auto} }
.tb .expand td{background:var(--g025); padding:20px 16px 24px}

/* ---- facts: label over value ---- */
.facts{display:grid; grid-template-columns:repeat(4,1fr); gap:24px}
.facts .k{font-size:13px; color:var(--g550)}
.facts .v{font-size:22px; letter-spacing:-.015em; margin-top:4px}
.facts .v small{font-size:13px; color:var(--g550); letter-spacing:0; margin-left:4px}

/* ---- key/value list ---- */
.kv{display:grid; grid-template-columns:180px 1fr; gap:8px 24px; font-size:15px}
.kv .k{color:var(--g550)}

/* ---- filter sentence: the filter is a sentence with the variable words as controls ---- */
.fs{font-size:15px; line-height:1.6; color:var(--g650)}
.fs b{font-weight:400; color:var(--navy); border-bottom:1px solid var(--blue100); padding-bottom:4px; cursor:pointer; white-space:nowrap}
.fs b:hover{border-bottom-color:var(--navy)}
.fs .add{font-size:15px; color:var(--navy); margin-left:8px}

/* ---- charts: instruments ---- */
.inst .hd{display:flex; align-items:baseline; justify-content:space-between; font-size:13px; color:var(--g550)}
.inst .hd b{font-weight:400; font-size:28px; color:var(--g900); letter-spacing:-.02em}
.inst .hd b small{font-size:13px; color:var(--g550); letter-spacing:0; margin-left:4px}
.inst svg{display:block; width:100%; margin-top:8px; overflow:visible}
.inst .ax{display:flex; justify-content:space-between; font-size:13px; color:var(--g550); margin-top:8px; padding-left:40px}
/* part-to-whole rows */
.ptw{display:grid; grid-template-columns:200px minmax(0,1fr) 156px; gap:16px; align-items:center; padding:8px 0; font-size:15px}
.ptw .bar{height:10px; background:var(--g100); border-radius:3px; overflow:hidden}
.ptw .bar i{display:block; height:100%; background:var(--navy)}
.ptw .n{text-align:right; color:var(--g650)}
@media (max-width:1000px){ .ptw{grid-template-columns:150px minmax(0,1fr) 130px} }
.ptw .n b{font-weight:400; color:var(--g900)}
/* latency bar in a log row */
.lat{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--g650); white-space:nowrap}
.lat i{display:inline-block; width:80px; height:6px; background:var(--g100); border-radius:3px; overflow:hidden; vertical-align:middle}
.lat i b{display:block; height:100%; background:var(--navy)}

/* ---- stage strip ---- */
.stage{display:flex; gap:4px}
.stage span{flex:1; background:var(--g050); color:var(--g550); font-size:13px; padding:8px 12px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%,9px 50%)}
.stage span:first-child{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%); border-radius:6px 0 0 6px}
.stage span:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,9px 50%); border-radius:0 6px 6px 0}
.stage span.done{background:var(--g100); color:var(--g650)}
.stage span.cur{background:var(--blue100); color:var(--navy)}

/* ---- outline: for long forms, a document outline instead of a stepper ---- */
.outline{font-size:15px}
.outline a{display:grid; grid-template-columns:28px 1fr auto; gap:8px; padding:8px 0; color:var(--g550)}
.outline a .n{color:var(--g550); font-size:13px; padding-top:4px}
.outline a.done{color:var(--g650)} .outline a.done .n{color:var(--g650)}
.outline a.cur{color:var(--navy)} .outline a.cur .n{color:var(--navy)}
.outline a .s{font-size:13px; color:var(--g550)}

/* ---- forms ---- */
.gn-field label{display:block; font-size:15px; margin-bottom:8px}
.gn-field label small{color:var(--g550); margin-left:8px; font-size:13px}
.gn-field .gn-in{display:flex; align-items:center; gap:8px; /* the portals' inputs flex so a prefix can sit inside; the system's are block */ border:1px solid var(--g200); border-radius:var(--r-part); padding:8px 16px; font-size:15px; line-height:1.35; background-color:var(--white); width:100%; max-width:520px; min-height:40px; box-sizing:border-box; color:var(--g900)}
/* the same class on a real control: an input is the component, not a div dressed as one */
input.gn-in, textarea.gn-in, select.gn-in{font-family:var(--ui); font-weight:400; outline:none}
.gn-field .gn-in.focus{border-color:var(--navy); box-shadow:0 0 0 3px rgba(1,61,91,.12)}
.choice{border-top:1px solid var(--g150)}
.choice label{display:grid; grid-template-columns:1fr auto; gap:24px; padding:16px 16px; border-bottom:1px solid var(--g100); cursor:pointer; border-radius:0}
.choice label:hover{background:var(--g050)}
.choice label.on{background:var(--blue100); color:var(--navy)}
.choice label .d{display:block; font-size:13px; color:var(--g550); margin-top:4px}
.choice label.on .d{color:var(--navy)}
.upload{border:1px dashed var(--g200); border-radius:var(--r-part); padding:28px; text-align:center; color:var(--g550); font-size:15px}
.upload .gn-link{margin-left:4px}

/* ---- code: the only place for mono ---- */
.code{background:var(--g025); border-radius:var(--r-part); padding:16px 20px; font-family:var(--code); font-size:13px; line-height:1.6; color:var(--g900); position:relative; overflow-x:auto; white-space:pre}
.code .ln{color:var(--g400); display:inline-block; width:28px; user-select:none}
.code .cp{position:absolute; right:16px; top:14px; font-family:var(--ui); font-size:13px; color:var(--navy)}
.key{font-family:var(--code); font-size:13px; background:var(--g050); border-radius:var(--r-small); padding:4px 8px; white-space:nowrap}
/* ---- a results area keeps its height so filtering does not move the page ---- */
.hold{min-height:calc(100vh - 420px)}
/* the one list whose two states differ by more than a viewport */
.hold.deep{min-height:calc(100vh - 120px)}

/* ---- segmented control: slices of ONE set of records ----
   Use tabs when the panels hold different content or different data sets;
   use this when every segment is the same data, filtered. ---- */
.gn-seg{overflow-x:auto; scrollbar-width:none}
.gn-seg::-webkit-scrollbar{display:none}
.segrow{display:flex; align-items:center; gap:20px; margin-top:24px; flex-wrap:wrap}
.segrow > .gn-seg{min-width:0; flex:0 1 auto}
@media (max-width:1000px){ .gn-seg{flex-wrap:wrap; overflow:visible; border-radius:999px} }
.segrow .rt{margin-left:auto; display:flex; gap:16px; font-size:15px}

/* the environment switch is a segmented control with one loaded segment */
.env{display:inline-flex; gap:4px; background:var(--g050); border-radius:999px; padding:4px}
.env button{padding:8px 16px; border-radius:999px; font-size:15px; color:var(--g650)}
.env button[aria-pressed="true"]{background:var(--white); color:var(--g900)}
.env button.live[aria-pressed="true"]{background:var(--g900); color:#fff}

/* ---- empty state, dialog, toast ---- */
.dialog{width:440px; padding:28px 32px}
.dialog .t{font-size:22px; letter-spacing:-.015em}
.dialog p{color:var(--g650); margin-top:8px; line-height:1.5}
.dialog .act{display:flex; gap:8px; justify-content:flex-end; margin-top:24px}

/* ---- shell: warm grey 050 sidebar, white content, navigation as words ---- */
/* the rail is fixed over the foot of the page, so the view reserves its
   height rather than ending in a slab of white above it */
.app{display:flex; flex-direction:column; min-height:100vh}
.app-b{display:flex; flex:1; min-height:0}

/* the rail already reserves its own height on the body */
.mn{flex:1; min-width:0; padding:0 48px 40px}

/* the agent's plan rows are the phase picker: a button per row, the open one on the selected ground */
.p5-pick{width:calc(100% + 24px); text-align:left; font:inherit; color:inherit; background:none; border:0; border-bottom:1px solid var(--g200); border-radius:0; cursor:pointer; padding:16px 12px; margin:0 -12px}
.p5-pick:hover{background:var(--g050)}
.p5-pick.is-on{background:var(--blue100); border-radius:var(--r-part); border-bottom-color:transparent}
.p5-pick.is-on .p5-t{color:var(--navy)}
.p5-pick:focus-visible{outline:2px solid var(--navy); outline-offset:-2px}
/* a timeline entry with no clock time has no time column */
.tl-i.no-t{grid-template-columns:minmax(0,1fr) auto}
/* a number never wraps in a table */
.gn-table td.is-num{white-space:nowrap}

/* ── the agent's book as a board: one column per stage, a card per partner ── */
.kb{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-top:16px}
.kb-col{background:var(--g025); border-radius:var(--r-surface); padding:12px; min-height:200px}
.kb-h{display:flex; justify-content:space-between; align-items:baseline; padding:4px 8px 12px} .kb-h b{font-weight:600}
.kb-card{background:var(--white); border:1px solid var(--g150); border-radius:var(--r-part); padding:12px 14px; margin-top:8px; cursor:pointer}
.kb-card:hover{border-color:var(--g400)} .kb-card:focus-visible{outline:2px solid var(--navy); outline-offset:2px}
.kb-t{display:flex; justify-content:space-between; gap:8px; align-items:baseline} .kb-t b{font-weight:600}
.kb-card > span{display:block; font-size:13px; color:var(--g650); margin-top:4px}
.kb-card > em{display:block; font-style:normal; font-size:13px; color:var(--g550); margin-top:6px}
/* ── the shared inbox: the list on the left, the thread on the right ── */
.inbox{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:0 32px; margin-top:16px; align-items:start}
.inbox-l{border-top:1px solid var(--g150)}
.inbox-i{padding:14px 12px; border-bottom:1px solid var(--g100); cursor:pointer; border-radius:0}
.inbox-i b{display:block; font-weight:400; color:var(--g900)} .inbox-i span{display:block; font-size:13px; color:var(--g550); margin-top:3px}
.inbox-i:hover{background:var(--g050)} .inbox-i.is-on{background:var(--blue100); border-radius:var(--r-part)} .inbox-i.is-on b{color:var(--navy)}
.inbox-i:focus-visible{outline:2px solid var(--navy); outline-offset:-2px}
.inbox-p{min-width:0} .inbox-h{padding-bottom:12px; border-bottom:1px solid var(--g150); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 24px; align-items:baseline}

/* ---- the first thing: a marked 025 surface ---- */

/* ---- slide-over: the one thing that floats ---- */
.scrim{position:fixed; inset:0; background:rgba(0,2,38,.28); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20}
.scrim.on{opacity:1; pointer-events:auto}
.panel{visibility:hidden; position:fixed; top:0; right:0; bottom:0; width:min(680px,92vw); background:#fff; z-index:21; transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1), visibility 0s .22s; display:flex; flex-direction:column; box-shadow:-8px 0 40px rgba(0,2,38,.12)}
.panel.on{transform:none; visibility:visible; transition:transform .22s cubic-bezier(.4,0,.2,1), visibility 0s}
.panel .top{padding:24px 40px 0; display:flex; align-items:center; font-size:15px; color:var(--g550)}

.panel .top .x:hover{background:var(--g050)}
.panel .ttl{padding:24px 40px 0}
.panel .ttl h2{font-size:28px; letter-spacing:-.02em; line-height:1.1}
.panel .meta{font-size:15px; color:var(--g550); margin-top:8px; display:flex; gap:8px; flex-wrap:wrap}
.panel .ptabs{display:flex; gap:24px; padding:24px 40px 0; border-bottom:1px solid var(--g150)}
.panel .ptabs button{padding:0 0 12px; font-size:15px; color:var(--g550); border-bottom:2px solid transparent; margin-bottom:-4px}
.panel .ptabs button[aria-pressed="true"]{color:var(--g900); border-bottom-color:var(--g900)}
.panel .body{flex:1; overflow-y:auto; padding:0 40px 32px}
.panel .pfoot{border-top:1px solid var(--g150); padding:16px 40px; display:flex; gap:8px; justify-content:flex-end; background:#fff}
.note{background:var(--g025); border-radius:var(--r-surface); padding:20px 24px; margin-top:24px; position:relative}
.note::before{content:""; position:absolute; left:0; top:20px; bottom:20px; width:3px; background:var(--navy); border-radius:0 2px 2px 0}
.note .k{font-size:13px; color:var(--g550)}
.note p{font-size:15px; line-height:1.5; margin-top:8px; max-width:560px}
.note .act{display:flex; gap:16px; align-items:center; margin-top:16px}
.note.plain::before{background:var(--g200)}
.psec{margin-top:32px}
.psec .hd{display:flex; align-items:baseline; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--g150)}
.psec .hd h3{font-size:22px; letter-spacing:-.015em}
/* whatever follows a section rule needs air: a chevron strip or a table must not sit on the hairline */
.psec .hd + *{margin-top:16px}
.sec .hd + *{margin-top:16px}
.psec .hd .ct{font-size:15px; color:var(--g550)}
.psec .hd .gn-link{margin-left:auto; font-size:15px}

/* ---- stage summary strip (pipeline) ---- */
.stages{margin-top:32px; background:var(--g025); border-radius:var(--r-surface); display:grid; grid-template-columns:repeat(5,1fr); overflow:hidden}
.stages > div{padding:20px 24px 16px; border-left:1px solid var(--g150)}
.stages > div:first-child{border-left:0}
.stages .k{font-size:13px; color:var(--g550)}
.stages .v{font-size:28px; letter-spacing:-.02em; margin-top:4px}
.stages .m{font-size:13px; color:var(--g550); margin-top:4px}
.stages .bar{height:6px; border-radius:3px; background:var(--g100); margin-top:16px; overflow:hidden}
.stages .bar i{display:block; height:100%; background:var(--navy)}

/* ---- tab strip: one component for page sub-navigation and record tabs ---- */
.tabstrip{display:flex; gap:24px; margin-top:24px; border-bottom:1px solid var(--g150); align-items:flex-end}
.tabstrip button{padding:0 0 12px; font-size:15px; color:var(--g550); border-bottom:2px solid transparent; margin-bottom:-4px; display:flex; gap:8px; align-items:baseline; white-space:nowrap}
.tabstrip button:hover{color:var(--g900)}
.tabstrip button[aria-pressed="true"]{color:var(--g900); border-bottom-color:var(--g900)}
.tabstrip button .ct{font-size:13px; color:var(--g550)}
.tabstrip button[aria-pressed="true"] .ct{color:var(--g550)}
.tabstrip .rt{margin-left:auto; display:flex; gap:16px; font-size:15px; padding-bottom:12px; color:var(--g550)}

/* ---- compact record list: label left, value right ---- */
.rec{font-size:15px}
.rec h4{font-size:13px; color:var(--g550); margin-bottom:8px}

.rec .l{color:var(--g550)}

/* ---- checkbox ---- */
.cb{width:18px; height:18px; border:1.5px solid var(--g200); border-radius:var(--r-small); display:inline-block; vertical-align:middle; background:var(--white)}
.cb.done{background:var(--navy); border-color:var(--navy); position:relative}

.done .t{color:var(--g550); text-decoration:line-through}

/* ── responsive: every component has a narrow form ── */
@media (max-width:1200px){ .now .inst{max-width:440px} .now .inst .ax{max-width:440px} }

}

}
.tight .ptw{grid-template-columns:150px 1fr 84px; font-size:15px; padding:8px 0}
/* ---- the sequence's own forward step: navy, not the signal ---- */
/* one primary colour, whatever the mood of the screen: .go is kept as a name so the markup reads, but it is the primary */

/* ---- milestones: a project as rows, with an owner on every one ---- */
/* ── a band's claim, and what proves it ───────────────────────────────
   One heading, thirty words, and the proof beside them rather than
   stacked under a second heading and a second lede. Bands 2, 3, 6 and 7
   were four stacked sections each; this is one. */
/* centred: the claim is half the height of what proves it, and aligning to
   the top stranded it above a slab of nothing */
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,440px); gap:80px; align-items:center}
/* the reach card carries a map and twelve names: 440px squeezed both */
.split.split-w{grid-template-columns:minmax(0,1fr) minmax(0,560px); gap:64px}
.split-t{min-width:0}
.split-t .eyebrow{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase}
.mkt .split-t h2{font-size:64px; letter-spacing:-.035em; line-height:1.04; margin-top:20px; max-width:13ch; text-wrap:balance}
.split-t p{font-size:15px; line-height:1.65; color:var(--g650); margin-top:20px; max-width:46ch}

/* three figures as a row under the claim, not a stacked column beside it */
.figs3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:auto auto;
       gap:8px 32px; margin-top:32px; padding-top:24px; border-top:1px solid var(--g150)}
/* subgrid so the labels share a line when one figure runs to two */
.rf{display:grid; grid-row:span 2; grid-template-rows:subgrid; align-content:start}
.rf .f{font-size:28px; letter-spacing:-.02em; line-height:1}
.rf h3{font-size:13px; color:var(--g550); font-weight:400}

.split-b{border-top:1px solid var(--g150)}
.bb{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:baseline;
    padding:16px 0; border-bottom:1px solid var(--g150)}
.bb h4{font-size:15px}
.bb-w{font-size:13px; color:var(--g550); text-align:right}
.bb-w span{display:block; color:var(--g550)}

@media (max-width:1040px){ .split,.split.split-w{grid-template-columns:1fr; gap:40px}
  .mkt .split-t h2,.split-t h2{font-size:40px; max-width:none}
  .figs3{grid-template-columns:1fr; gap:0}
  .rf{grid-row:auto; display:block; padding:12px 0; border-bottom:1px solid var(--g150)}
  .rf:last-child{border-bottom:0}
  .rf h3{margin-top:4px} }

/* the three destinations that close the page: its own component rather than a
   restyle of .rcards, which paints its own layout elsewhere */
.dests{display:flex; flex-direction:column; gap:12px}
.dests a{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:baseline;
         background:var(--white); border:1px solid var(--g150); border-radius:var(--r-part);
         padding:20px 24px; cursor:pointer}
.dests a:hover{background:var(--g025)}
.dests h4{font-size:15px}
.dest-go{font-size:13px; color:var(--navy); white-space:nowrap}

/* the alliance names are the map's legend: one wrapped run, not a grid */
.alli{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 32px; margin-top:8px}
.alli > span{display:flex; align-items:baseline; gap:8px; padding:8px 0; font-size:15px;
             cursor:default; color:rgba(255,255,255,.82)}
.alli > span.on{color:#fff}
.alli-c{font-size:13px; color:rgba(255,255,255,.45); margin-left:auto; white-space:nowrap}
.alli > span.on .alli-c{color:rgba(255,255,255,.8)}
/* the four that opened since 2024, marked the same way the map marks them */
.alli > span.alli-nw::before{content:''; width:6px; height:6px; border-radius:50%;
      background:var(--sig); flex:none; transform:translateY(-2px)}
.alli > span:not(.alli-nw)::before{content:''; width:6px; flex:none}
@media (max-width:560px){ .alli{grid-template-columns:1fr} }

/* ── entry, and the motion that explains ─────────────────────────────
   A section arrives from where it will sit — eight pixels, once. The map
   plots in the order the alliances joined, oldest first, because that is
   the argument the band is making. The cost bars grow so the comparison
   builds. Nothing loops; reduced-motion removes all of it. */
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0; transform:translateY(8px);
      transition:opacity .5s cubic-bezier(.2,.6,.2,1), transform .5s cubic-bezier(.2,.6,.2,1)}
  .rv.in{opacity:1; transform:none}

  /* a band assembles rather than blinking: its parts arrive 60ms apart */
  .rv .split-t > *{opacity:0; transform:translateY(6px);
      transition:opacity .45s cubic-bezier(.2,.6,.2,1) var(--sd,0ms),
                 transform .45s cubic-bezier(.2,.6,.2,1) var(--sd,0ms)}
  .rv.in .split-t > *{opacity:1; transform:none}
  .rv .split-t > *:nth-child(2){--sd:60ms}
  .rv .split-t > *:nth-child(3){--sd:120ms}
  .rv .split-t > *:nth-child(4){--sd:180ms}

  /* the marks plot oldest to newest, on the delay the renderer set */
  .wmap .m{opacity:0; transition:opacity .32s ease var(--d,0ms)}
  .wmap.plotted .m{opacity:1}

  /* the comparison builds */
  .cst .fill{width:0; transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .cst.drawn .fill{width:var(--w)}
}
  /* picking a product changes what is happening: the card settles into its
     new state rather than being swapped out under the cursor */
  #catPane{transition:opacity .22s ease, transform .22s ease}
  #catPane.swap{opacity:0; transform:translateY(4px)}

  /* a row that can be picked says so before it is picked */
  .cat .it{transition:background .16s ease, box-shadow .16s ease}
  .cat .it:not(.sel):hover{background:var(--g025); box-shadow:inset 2px 0 0 var(--g200)}
  .cat .it.sel{box-shadow:inset 2px 0 0 var(--navy)}

  /* a cost segment is worth pointing at */
  .cst .fill i{transition:filter .16s ease}
  .cst .r:hover .fill i{filter:saturate(1.25)}
}
@media (prefers-reduced-motion:reduce){
  .wmap .m{opacity:1}
  .cst .fill{width:var(--w)}
}

/* ── the marketing accent law ─────────────────────────────────────────
   On the marketing pages the call to action is **Primary**, and Heritage
   steps back to being an accent — a mark, never a fill behind a label.
   Inside the product Heritage keeps the primary action, because there it
   is the colour that means "this one needs you".

   The swap also fixes the one pair in the system that never cleared AA:
   white on Heritage is 3.0:1, white on Primary is 14.7:1. */
.mkt .gn-btn--primary{background:var(--primary); border-color:var(--primary); color:#fff}
.mkt .gn-btn--primary:hover{background:#2E0B7E; border-color:#2E0B7E}
/* marketing buttons are pills. The product keeps the 8px part radius, because
   there a button sits in a row of parts that share one shape. */
.mkt .gn-btn{border-radius:999px; height:44px; padding:0 24px}
.mkt .gn-btn--sm{height:36px; padding:0 18px}

/* ── the close ────────────────────────────────────────────────────────
   The page ends on Primary. Every other band was a split, so the last one
   read as another section rather than an ending; centred on the brand it
   reads as the last word. Band 5 is Base Dark and this is Primary, so the
   two dark moments are distinct rather than a repetition.

   The button inverts to white here. Primary on Primary is invisible and
   Heritage is the accent, not the action — white keeps both rules and is
   the highest contrast available on this ground. */
.bd-brand{background:var(--primary); color:#fff}
/* The close is the sandbox. Rich: "This is a moment to demonstrate how easy
   it is to connect" — so the artifact is the call itself and its answer,
   beside the ask, rather than a claim about the numbers. */
.close{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,480px); gap:64px; align-items:center}
.close .eyebrow{font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--burst-lt)}
.mkt .close h2{font-size:64px; letter-spacing:-.035em; line-height:1.04; margin-top:20px; color:#fff;
          max-width:13ch; text-wrap:balance}
.close p{font-size:22px; letter-spacing:-.015em; line-height:1.5; color:rgba(255,255,255,.72);
         margin-top:20px; max-width:34ch}
.close-act{margin-top:32px; display:flex; gap:16px; align-items:center}
.mkt .gn-btn.on-ink{background:#fff; border-color:#fff; color:var(--primary)}
.mkt .gn-btn.on-ink:hover{background:var(--base-lt); border-color:var(--base-lt)}
/* the call and its answer, as they would appear */
.close-code{background:rgba(0,2,38,.28); border-radius:var(--r-surface); padding:24px;
            font-family:var(--code); font-size:13px; line-height:1.6; color:rgba(255,255,255,.85)}
.close-code pre{margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit}
.cc-l{font-family:var(--ui); font-size:13px; color:var(--burst-lt); margin-bottom:8px}
.cc-l + pre + .cc-l{margin-top:20px; padding-top:20px; border-top:1px solid rgba(255,255,255,.14)}
.close-code .cc-ok{color:var(--good-ink)}
.close-d{display:flex; gap:40px; margin-top:56px; padding-top:24px;
         border-top:1px solid rgba(255,255,255,.18)}
.close-d a{font-size:15px; color:var(--burst-lt); cursor:pointer}
.close-d a:hover{color:#fff}
@media (max-width:1040px){ .close{grid-template-columns:1fr; gap:40px}
  .mkt .close h2,.close h2{font-size:40px; max-width:none} }
@media (max-width:640px){ .close-d{flex-direction:column; gap:12px} }

/* ── the coverage panel ───────────────────────────────────────────────
   Reach as a thing you look at. It was a centred column of type — a
   number, three figures, twelve names and a caption — which is a wall of
   text however well set. The map is the artifact; on ink the marks read
   as lit points rather than grey specks, and the three networks close it
   like a footer on a console. */
.cover{background:var(--base-dk); border-radius:var(--r-surface); overflow:hidden;
       box-shadow:0 2px 4px rgba(0,2,38,.06), 0 24px 56px rgba(0,2,38,.16)}
.cover .wmap{padding:28px 24px 4px}
.cover .wmap svg{max-height:300px}
.cover .wmap .land{fill:var(--ink-land)}
/* the alliances are the subject, so they are the lit points; the four that
   opened since 2024 take the accent, and nothing else on this band does */
.cover .wmap .mk{fill:var(--ink-mark); r:5}
.cover .wmap .mk.home{fill:#fff; r:5.5}
.cover .wmap .nw .mk{fill:var(--sig); r:5.5}
.cover .wmap .nwring,.cover .wmap .ring{stroke:none}
.cover .wmap .on .mk{r:7}
.cover .wmap .lbl,.cover .wmap .on .gn-eyebrow{fill:#fff}
.cover .wmap .m{cursor:default}
/* the legend is the answer to "which countries": on the card, always
   readable, and cross-lit with the map on hover in both directions */
.cover-l{padding:16px 24px 24px; border-top:1px solid rgba(255,255,255,.12)}
.cover-lh{font-size:13px; color:rgba(255,255,255,.5); letter-spacing:.04em; text-transform:uppercase}
@media (max-width:640px){ .cover .wmap svg{max-height:220px} }

/* ── a band heading that is not a split ───────────────────────────────
   Centred-left, full width, so the cards under it get the whole measure. */
.sech2{max-width:900px}
.sech2 .eyebrow{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase}
/* a marketing band's heading is a display size, not a section label. Every
   site in this category sets these at 60-72px; ours were 40 and the page
   had no voice. */
.mkt .sech2 h2{font-size:64px; letter-spacing:-.035em; line-height:1.04; margin-top:20px; text-wrap:balance}
/* heading left, lede right, baselines aligned. Used where the body below
   runs the full measure and a half-empty header line reads as a gap. */
.sech2-w{max-width:none; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,400px);
         gap:64px; align-items:end}
.sech2-w .sech2-p{font-size:15px; line-height:1.65; color:var(--g650); margin-top:0; max-width:none}
@media (max-width:1000px){ .sech2-w{grid-template-columns:1fr; gap:20px; align-items:start} }
.sech2-p{font-size:22px; letter-spacing:-.015em; line-height:1.5; color:var(--g550); margin-top:20px; max-width:52ch}

/* ── three things you look at ─────────────────────────────────────────
   Eight products as rows you had to click through was a list wearing a
   control's clothes: nothing was visible until you selected it. Three
   cards instead, each carrying a different *kind* of picture — a round
   trip, a before-and-after, a comparison — so the band reads without
   being operated. The other five are named in a line beneath. */
.cards3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; margin-top:40px}
.c3{min-width:0}
/* On ink. Every site in this category lands a high-contrast artifact on a
   light ground — a dark card on pale blue, a dark console on cream — and it
   is the only reason their pages have anywhere for the eye to go. This page
   was white and warm grey the whole way down. The ink is already in the
   palette; it had only ever been used at full-band scale. */
.c3-v{background:var(--base-dk); border-radius:var(--r-surface); color:#fff;
      padding:20px 24px; height:248px; display:grid; grid-template-rows:auto 1fr auto;
      box-shadow:0 2px 4px rgba(0,2,38,.06), 0 24px 56px rgba(0,2,38,.16)}
.c3-v .st.ok{color:var(--good-ink)} .c3-v .st.wa{color:var(--warn-ink)} .c3-v .st.no{color:var(--bad-ink)}
.c3 h3{font-size:22px; letter-spacing:-.015em; margin-top:20px}

/* One grammar for all three, so the band reads as one argument rather than
   three unrelated diagrams: what came in, the thing itself, what came out.
   They were three different internal layouts with eight labels each. */
.c3-t{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
      padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.14);
      font-size:13px; color:rgba(255,255,255,.55)}
.c3-t .gn-mono{color:#fff; overflow-wrap:anywhere}
.c3-m{display:flex; flex-direction:column; justify-content:center; min-height:0}
.c3-b{display:flex; align-items:baseline; gap:12px; padding-top:16px;
      border-top:1px solid rgba(255,255,255,.14); font-size:13px; color:rgba(255,255,255,.55)}

/* one · the round trip. The arc is the journey and the figure sits on it. */
.tr-arc{position:relative}
.tr-arc svg{display:block; width:100%; height:80px; overflow:visible}
.tr-arc .arc{fill:none; stroke:var(--ink-mark); stroke-width:1.5; stroke-linecap:round;
             stroke-dasharray:300; stroke-dashoffset:300}
.c3-trip.on .arc{stroke-dashoffset:0; transition:stroke-dashoffset 1.2s cubic-bezier(.3,.7,.3,1)}
.tr-arc .e{fill:var(--ink-mark)}
.tr-ms{position:absolute; left:0; right:0; top:32px; text-align:center;
       font-size:28px; letter-spacing:-.02em; line-height:1; color:#fff}
.tr-ms small{font-size:13px; color:rgba(255,255,255,.55); margin-left:2px}
.tr-ends{display:flex; justify-content:space-between; font-size:13px;
         color:rgba(255,255,255,.45); margin-top:-4px}

/* two · the card changes and the token does not, so the token is the figure */
.tk-sw{display:flex; align-items:baseline; gap:12px; font-size:15px;
       color:rgba(255,255,255,.45)}
.tk-sw .was{text-decoration:line-through}
.tk-sw .tk-now{color:rgba(255,255,255,.82)}
.tk-hold{display:flex; align-items:baseline; gap:12px; margin-top:16px}
.tk-hold .gn-mono{font-size:28px; letter-spacing:-.01em; color:#fff}

/* three · the signal is the substance, so it is set as the statement */
.dc-sig{font-size:22px; letter-spacing:-.015em; line-height:1.35; color:#fff}
.dc-out{display:flex; gap:32px; margin-top:20px}
.dc-out .o{display:flex; align-items:baseline; gap:8px; font-size:13px;
           color:rgba(255,255,255,.55)}
.dc-out .o .st{font-size:15px}
.dc-out .o.no{opacity:.5}
.cards3-f .gn-link{white-space:nowrap}
.cards3-f{font-size:13px; color:var(--g550); margin-top:32px; line-height:1.6; max-width:76ch}

@media (max-width:1100px){ .cards3{grid-template-columns:1fr; gap:32px}
  .c3-v{height:auto; min-height:220px} .mkt .sech2 h2,.sech2 h2{font-size:40px} }

/* ── the sizer ────────────────────────────────────────────────────────
   The interaction is the argument here, so the controls are worth
   looking at and the outputs are worth their scale. */
/* One surface, both halves top-aligned. It was two floating columns centred
   against each other, which stranded 380px of nothing under the heading and
   made the controls look like they belonged to a different band. */
#sizer .sizer{margin-top:48px; gap:0; align-items:stretch;
              grid-template-columns:minmax(0,380px) minmax(0,1fr);
              background:var(--white); border-radius:var(--r-surface); overflow:hidden}
#sizer .sz{padding:32px; border-right:1px solid var(--g150)}
#sizer .sz .ct{padding:20px 0; border-bottom:1px solid var(--g150)}
#sizer .sz .ct:first-child{padding-top:0}
#sizer .sz label{font-size:15px; color:var(--g650)}
#sizer .sz label b{font-size:22px; letter-spacing:-.015em; color:var(--g900)}
#sizer .sz input[type=range]{margin-top:14px; height:24px}
#sizer .sz .as{padding-top:20px; max-width:none}
/* Each result is a row: the figure, then what it is and how it was got,
   beside it rather than under it. Stacked-with-text-below left 600px of
   empty surface; three columns wrapped the longest figure onto two lines
   and broke the shared baseline. */
#sizer .out{grid-template-columns:1fr; gap:0; padding:8px 40px; align-content:center}
#sizer .out > div{display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr);
                  gap:0 40px; align-items:baseline; padding:28px 0;
                  border-bottom:1px solid var(--g150)}
#sizer .out > div:last-child{border-bottom:0}
#sizer .out .v{font-size:40px; letter-spacing:-.03em; line-height:1; white-space:nowrap;
               font-variant-numeric:tabular-nums}
#sizer .out .v small{font-size:15px; letter-spacing:0; margin-left:6px; color:var(--g550)}
#sizer .out .k{grid-column:2; font-size:22px; letter-spacing:-.015em; color:var(--g900); margin-top:0}
#sizer .out .m{grid-column:2; font-size:15px; color:var(--g550); margin-top:8px; line-height:1.55}
@media (max-width:1040px){ #sizer .out{padding:8px 32px}
  #sizer .out > div{grid-template-columns:1fr; gap:8px}
  #sizer .out .k,#sizer .out .m{grid-column:1} }
@media (max-width:980px){ #sizer .sizer{grid-template-columns:1fr}
  #sizer .sz{border-right:0; border-bottom:1px solid var(--g150)} }

/* ── the cost, as two numbers ─────────────────────────────────────────
   It was a stacked bar and a five-row table on a dark ground, which is a
   chart nobody reads over a table nobody reads. Two figures, the bars
   under them, and the detail as one line. */
.sech2-d h2{color:#fff}
.sech2-d .eyebrow,.sech2-d .sech2-p{color:rgba(255,255,255,.62)}
.sech2-d h2 .mute{color:rgba(255,255,255,.5)}
.costwo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:56px; margin-top:56px}
.cw-k{font-size:13px; color:rgba(255,255,255,.62); letter-spacing:.04em; text-transform:uppercase}
.cw-n{font-size:64px; letter-spacing:-.04em; line-height:1; color:#fff; margin-top:12px}
.cw-n small{font-size:22px; letter-spacing:-.015em; color:rgba(255,255,255,.5); margin-left:8px}
.cw-bar{display:flex; gap:4px; height:12px; margin-top:24px}
.cw-bar i{display:block; height:100%; border-radius:2px; width:0; transition:width .9s cubic-bezier(.2,.7,.2,1)}
.cw-bar i.a{background:var(--c1)}
.cw-bar i.b{background:var(--c2)}
.rv.in .cw-bar i{width:var(--w)}
.cw-l{display:flex; flex-direction:column; gap:4px; margin-top:16px;
      font-size:13px; color:rgba(255,255,255,.62)}
.cw.is-new .cw-n{color:#fff}
@media (max-width:900px){ .costwo{grid-template-columns:1fr; gap:40px} .cw-n{font-size:40px} }

/* ── four propositions, each led by what it proved ────────────────────
   Four rows of prose with a participant on the right became four columns
   that open with the figure. The claim is the small type now and the
   evidence is the large type, which is the right way round. */
/* Four stat columns — eyebrow, figure, unit, name — was the stat-card row
   this system bans, and it left the figures shouting over the partners who
   actually built the things. Four rows instead: who, what, and what it came
   to, aligned down the page and read in one pass. */
.roster{margin-top:40px; border-top:1px solid var(--g150)}
.ro{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,auto);
    gap:32px; align-items:baseline; padding:24px 0; border-bottom:1px solid var(--g150)}
.ro-w{font-size:22px; letter-spacing:-.015em}
.ro-k{font-size:15px; color:var(--g650)}
.ro-f{font-size:22px; letter-spacing:-.015em; text-align:right; white-space:nowrap;
      font-variant-numeric:tabular-nums}
.ro-f span{font-size:15px; color:var(--g550); letter-spacing:0; margin-left:8px}
@media (max-width:860px){ .ro{grid-template-columns:1fr; gap:6px; padding:18px 0}
                          .ro-f{text-align:left} }

/* ── a claim, and one thing to look at ────────────────────────────────
   One idea per view, thirty words at most, and a product artifact beside
   it carrying the proof. The artifact is an excerpt that stands for the
   record rather than printing it: four rows imply thirty-four, the way
   seven query rows imply eight hundred. Rows are still the workhorse —
   inside the artifact, where they are the thing you look at, not the
   whole screen you have to read. */
.claim{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,520px);
       gap:72px; align-items:center; padding:48px 0 56px}
.claim-t{min-width:0}
.claim-t .eyebrow{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase}
.claim-t h2{font-size:40px; letter-spacing:-.03em; line-height:1.08; margin-top:16px; text-wrap:balance}
.claim-t p{font-size:15px; line-height:1.65; color:var(--g650); margin-top:20px; max-width:44ch}
.claim-t .act{margin-top:28px; display:flex; gap:24px; align-items:center}

.art{background:var(--white); border-radius:var(--r-surface); overflow:hidden;
     box-shadow:0 2px 4px rgba(0,2,38,.05), 0 24px 56px rgba(0,2,38,.12)}
.art-hd{display:flex; align-items:baseline; justify-content:space-between;
        padding:16px 20px; border-bottom:1px solid var(--g100); font-size:13px; color:var(--g550)}
.art-hd b{font-weight:400; color:var(--g900); font-size:15px}
.art-live{color:var(--good)}
.art-r{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:baseline;
       padding:12px 20px; border-bottom:1px solid var(--g100); font-size:15px}
.art-r:last-of-type{border-bottom:0}
.art-r .sub{display:block; font-size:13px; color:var(--g550); margin-top:4px}
.art-r .m{font-size:13px; color:var(--g550); white-space:nowrap}
.art-r .m.ok{color:var(--good)}
.art-tag{display:inline-block; font-family:var(--code); font-size:13px; color:var(--navy); margin-right:12px}
.art-f{padding:12px 20px; background:var(--g025); font-size:13px; color:var(--g550)}
@media (max-width:1100px){ .claim{grid-template-columns:1fr; gap:40px; padding:32px 0 40px}
                           .claim-t h2{font-size:28px} }

/* ── the story rail ───────────────────────────────────────────── */
.rail{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--white); border-top:1px solid var(--g150); padding:12px 28px; display:flex; align-items:center; gap:24px}
.rail .who{display:flex; align-items:center; gap:8px; min-width:220px}
.rail .who i{width:26px; height:26px; border-radius:6px; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:13px; font-style:normal; flex:none}
.rail .who .n{font-size:15px; line-height:1.25}
.rail .who .n span{display:block; font-size:13px; color:var(--g550)}
.rail .acts{display:flex; gap:24px; align-items:center; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none}
.rail .acts::-webkit-scrollbar{display:none}
.rail .act{display:flex; align-items:center; gap:8px}
.rail .act > .lb{font-size:13px; color:var(--g550); white-space:nowrap; margin-right:4px}
.rail .p{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:13px; color:var(--g550); cursor:pointer; border:1px solid var(--g150); background:var(--white); flex:none}
.rail .p:hover{border-color:var(--g400); color:var(--g900)}
.rail .p.on{background:var(--sig); border-color:var(--sig); color:#fff}
/* the seats on screen take Primary; Heritage stays with the one current panel */
.rail .who .p.on{background:var(--primary); border-color:var(--primary)}
.rail .p.seen{border-color:var(--navy); color:var(--navy)}
.rail .nav2{display:flex; align-items:center; gap:16px; margin-left:auto}
.rail .nav2 .gn-link{white-space:nowrap}
/* the clock sits with the panel links; system parts, placement only */
.rail .clk{display:flex; align-items:center; gap:8px; white-space:nowrap}
.rail .clk .gn-btn--sm{min-width:28px; padding:0 8px}
/* with the clock beside them the three act titles no longer fit under 1760px; the act number stays, the title moves to the label's tooltip */
@media (max-width:1760px){ .rail .act-t{display:none} }
.rail .cap{position:fixed; left:0; right:0; bottom:57px; z-index:59; background:var(--g900); color:#fff; padding:16px 28px; display:flex; gap:20px; align-items:baseline}
.rail .cap .t{font-size:15px; white-space:nowrap}
.rail .cap .d{font-size:15px; color:rgba(255,255,255,.72); line-height:1.45}
.rail .cap .x{margin-left:auto; font-size:13px; color:rgba(255,255,255,.72); cursor:pointer; white-space:nowrap}
.rail .cap .x:hover{color:#fff}
/* the rail and the narration bar above it are fixed over the foot of the
   page; the body reserves their height once. The view used to reserve it
   a second time, which is where the slab of white came from. */
body.railed{padding-bottom:var(--rail-h,128px)}

/* ── chrome 1 · the public site ───────────────────────────────── */
/* the footer band bleeds to the edge and closes the page; bottom padding
   here left a slab of white under it */
/* ── chrome 1 · the public site: bands, hero grid, the prepared masthead ──
   Restored September 2026 after a section cut took them with the product
   screens they had been filed under. They belong here. */
.prepbar{max-width:1000px; margin:0 auto; padding:32px 40px 0; display:flex; align-items:flex-start; gap:20px}
.prepbar .who{font-size:13px; color:var(--g550); line-height:1.5}
.prepbar .who b{display:block; font-weight:400; color:var(--g900); font-size:15px}
.prepbar .stamp{margin-left:auto; text-align:right; font-size:13px; color:var(--g550); line-height:1.5}
.mkt h2{font-size:28px; letter-spacing:-.02em; line-height:1.15}
.mkt .sech.sub h2{font-size:22px; letter-spacing:-.015em}
.mkt .sech{margin-top:0; align-items:baseline}
.mkt .sech .t13{font-size:15px}
.mkt .lede{font-size:22px; line-height:1.5; color:var(--g650); max-width:64ch; margin-top:16px}
.bd{width:var(--vw); margin-left:calc(50% - var(--vw)/2); padding:88px max(40px,calc(var(--vw)/2 - 620px))}
.bd + .bd{margin-top:0}
.bd.tone{background:var(--g025)}
.bd.dark{background:var(--g900); color:#fff}
.bd.dark h2, .bd.dark .lede{color:#fff}
.bd.dark .lede{color:rgba(255,255,255,.72)}
.bd.dark .t13{color:rgba(255,255,255,.6)}
.bd.plain{padding-top:64px; padding-bottom:0}
.mh{padding:80px 0 0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,420px);
     gap:72px; align-items:center}
.mh-t{min-width:0}

.site{max-width:1240px; margin:0 auto; padding:0 40px}
.sitebar{display:flex; align-items:center; gap:40px; padding:24px 0 0; max-width:1240px; margin:0 auto}
.sitebar .mark{display:flex; align-items:center; gap:8px; font-size:15px; letter-spacing:-.01em}
.sitebar .mark i{width:24px; height:24px; border-radius:6px; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:10px; font-style:normal}
.sitebar .lks{display:flex; gap:24px; font-size:15px; color:var(--g650)}
.sitebar .lks span{cursor:pointer}
.sitebar .lks span:hover{color:var(--g900)}
.sitebar .lks span.on{color:var(--navy); box-shadow:0 1px 0 var(--navy)}
.sitebar .lks a.dev{cursor:pointer} .sitebar .lks a.dev:hover{color:var(--g900)}
.hero{padding:64px 0 0}
.hero .eyebrow{font-size:13px; color:var(--g550); letter-spacing:.02em}
.hero h1{font-size:40px; line-height:1.06; letter-spacing:-.03em; margin-top:16px; max-width:18ch}
.hero p{font-size:22px; line-height:1.55; color:var(--g650); margin-top:20px; max-width:62ch}
.hero .act{margin-top:32px; display:flex; gap:20px; align-items:center}
@media (max-width:820px){ .hero h1{font-size:40px} }
.band{margin-top:56px; padding:32px 0; border-top:1px solid var(--g150); border-bottom:1px solid var(--g150); display:grid; grid-template-columns:repeat(4,1fr); gap:28px}
.band .k{font-size:13px; color:var(--g550)}
.band .v{font-size:28px; letter-spacing:-.02em; margin-top:4px}
.band .v small{font-size:15px; letter-spacing:0; color:var(--g550); margin-left:8px}
.offers{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 36px; margin-top:16px}
.offer{padding:24px 0; border-top:1px solid var(--g100)}
.offer h3{font-size:22px; letter-spacing:-.01em}
.offer p{font-size:15px; line-height:1.55; color:var(--g650); margin-top:8px}
.offer .m{font-size:13px; color:var(--g550); margin-top:12px}
.offer.on{box-shadow:inset 3px 0 0 var(--sig); padding-left:16px; margin-left:-16px}
@media (max-width:900px){ .offers{grid-template-columns:1fr} .band{grid-template-columns:repeat(2,1fr); gap:24px} }

/* ── vertical rhythm ──────────────────────────────────────────────────
   Five steps off the 4px grid, named for what they separate. Before this
   the renderers carried thirteen different inline margins; presentation
   belongs here, and a rhythm you can name is a rhythm you can keep. */
.rh-band {margin-top:72px}   /* the first band after the hero */
.rh-sec  {margin-top:48px}   /* a new section inside a band */
.rh-part {margin-top:32px}   /* a part after what it follows */
.rh-item {margin-top:24px}   /* an item under its heading */
.rh-tight{margin-top:16px}
.rh-close{margin-top:8px}
.bd-close{padding-bottom:80px}   /* the band that ends the page */
.p-note{max-width:80ch}          /* a note set on the measure, not the column */
.surface.set{padding:24px}
/* the plan's legend swatches, drawn in CSS rather than by the renderer */
.plan .lg i.biz{background:var(--navy)}
.plan .lg i.tech{background:var(--g400)}
.plan .lg i.split{background:linear-gradient(90deg,var(--navy) 0 55%,var(--g400) 55%)}
.plan .lg i.dash{background:transparent; border:1px dashed var(--g200)}
/* the request-log table: the clock column is fixed so rows align down the page */
.tb td.when{width:112px}

/* ── the hero illustration ────────────────────────────────────────────
   A drawing, not a screenshot. One surface carries the instrument; one
   card floats off its corner and breaks the edge, which is the only
   thing on this page allowed to overlap another. Volume is illustrative;
   the authorization is the one the products band proves. */
.heroart{position:relative; min-width:0}
.ha-panel{background:var(--g025); border:1px solid var(--g150); border-radius:var(--r-surface);
          padding:16px 16px 8px}
.ha-hd{display:flex; align-items:baseline; justify-content:space-between;

/* product shots: the app, used as the page's imagery */
