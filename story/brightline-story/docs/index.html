@media (max-width:900px){ .figs{grid-template-columns:1fr; gap:32px} }

/* the sizing block: the page computes something about the reader */
.sizer{display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:56px; margin-top:24px; align-items:start}
.sz .ct{padding:16px 0; border-bottom:1px solid var(--g150)}

.sz .as{font-size:13px; color:var(--g550); line-height:1.5; padding-top:16px; max-width:44ch}

@media (max-width:980px){ .sizer{grid-template-columns:1fr; gap:32px} .out{grid-template-columns:1fr} .out > div + div{border-left:0; border-top:1px solid var(--g150); padding:20px 0 0; margin-top:20px} }

/* a four-column comparison used for cost and for approval behaviour */

/* participants: membership as proof, set as plain names */
       border-top:1px solid var(--g150); border-bottom:1px solid var(--g150)}
@media (max-width:900px){ .parts{grid-template-columns:1fr 1fr} }

.sfoot{width:var(--vw); margin-left:calc(50% - var(--vw)/2); background:var(--g025); padding:64px max(40px,calc(var(--vw)/2 - 620px)) 40px}

.out .v{font-size:40px}

.figs .shot{aspect-ratio:4/3}

/* the prepared page is narrower, so its outputs stack */

/* ── cost per transaction: two totals on one scale ───────────────
   Palette computed for the dark surface and validated: lightness
   band, chroma floor, CVD separation, normal-vision floor and
   contrast all pass. Values live in the table underneath. */
.cst{margin-top:24px}
.cst .r{display:grid; grid-template-columns:150px minmax(0,1fr) 96px; gap:24px; align-items:center; padding:12px 0}
.cst .lb{font-size:15px; color:rgba(255,255,255,.72)}

.cst .fill i:last-child{border-radius:0 4px 4px 0}
.cst .fill i b{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:400;
               font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums}
.cst .tot{font-size:22px; letter-spacing:-.015em; text-align:right; color:#fff}
.cst .tot small{font-size:13px; color:rgba(255,255,255,.6); margin-left:4px}
.cst .lg{display:flex; flex-wrap:wrap; gap:8px 24px; padding:16px 0 0 172px; font-size:13px; color:rgba(255,255,255,.72)}

         font-size:15px; line-height:1.5; color:rgba(255,255,255,.72); min-height:44px}

}

/* the alliance roster: the names are what make the model credible */
/* direct children only: each cell also holds an .alli-c span for its country,
   and a descendant selector here outranks .alli-c and resizes it */


/* the catalogue an acquirer would shop, with the story's three marked */
.cat{margin-top:24px; border-top:1px solid var(--g150)}
.cat .it{display:grid; grid-template-columns:minmax(0,230px) minmax(0,1fr) 190px; gap:28px;
         padding:16px 0; border-bottom:1px solid var(--g100); align-items:baseline}
.cat .it .n{font-size:15px}
.cat .it .d{font-size:15px; line-height:1.5; color:var(--g650)}
.cat .it .s{font-size:13px; color:var(--g550); text-align:right}
.cat .fn{font-size:13px; color:var(--g550); padding-top:16px; line-height:1.5}
@media (max-width:900px){ .cat .it{grid-template-columns:1fr; gap:4px} .cat .it .s{text-align:left} }

/* what you can build with the network rather than buy from it */
     border-top:1px solid var(--g150); border-bottom:1px solid var(--g150)}
@media (max-width:900px){ .bld{grid-template-columns:1fr} .bld > div:nth-child(even){border-left:0; padding-left:0} }

/* before and after, with the old value cancelled. Where a comparison
   is the whole point of a section, it belongs in one line, not in a
   column of sentences. Class names are prefixed: .now and .cap are

.ba{display:flex; align-items:baseline; gap:16px; background:var(--g025);
    border-radius:var(--r-surface); padding:24px 28px; margin-top:24px; flex-wrap:wrap}
.bd.tone .ba{background:var(--white)}
.ba-was{font-size:22px; letter-spacing:-.015em; color:var(--g400);
        text-decoration:line-through; text-decoration-thickness:1px}
.ba-ar{font-size:22px; color:var(--g400); line-height:1}
.ba-now{font-size:40px; letter-spacing:-.03em; color:var(--g900)}

@media (max-width:820px){ .ba-cap{margin-left:0; width:100%; text-align:left} }

/* resources: three destinations, sized to be clicked */
.rcards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:24px}
.rcards a{display:block; background:var(--white); border:1px solid var(--g150); border-radius:var(--r-surface);
          padding:24px 28px 24px; cursor:pointer}

.rcards p{font-size:15px; line-height:1.5; color:var(--g650); margin-top:8px}
.rcards .go{display:block; font-size:15px; color:var(--g550); margin-top:16px}
@media (max-width:900px){ .rcards{grid-template-columns:1fr} }

/* ── reach is geographic, so it is drawn ─────────────────────────
   A plate carrée plot: simplified landmasses, one mark per market.
   Hovering a mark lights its row in the roster and the reverse. */
.wmap{margin:0; position:relative; min-width:0}
.wmap svg{display:block; width:100%; height:auto; max-height:300px}

.wmap .lbl{font-size:13px; fill:var(--g550); opacity:0; pointer-events:none}

.wmap .cap{font-size:13px; color:var(--g550); padding-top:12px; line-height:1.5}

   Names on the left; on the right the product itself, built as a

.catwrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:52px; margin-top:24px; align-items:start}
.cat{margin-top:0; border-top:1px solid var(--g150); border-bottom:1px solid var(--g150)}
.cat .it{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; padding:16px 16px;
         border-bottom:1px solid var(--g100); align-items:baseline; cursor:pointer}
.cat .it:last-child{border-bottom:0}

.cat .it.sel{background:var(--blue100)}

/* a piece of the product, on a card that floats */

        box-shadow:0 1px 2px rgba(0,2,38,.05), 0 12px 34px rgba(0,2,38,.09)}

.moment .hd .t{font-size:15px}

.moment .hd .st{margin-left:auto; font-size:13px}
.moment .r{display:grid; grid-template-columns:minmax(0,140px) minmax(0,1fr); gap:16px;
           padding:12px 24px; border-bottom:1px solid var(--g100); font-size:15px; align-items:baseline}
.moment .r:last-of-type{border-bottom:0}
.moment .r .l{color:var(--g550)}

@media (max-width:980px){ .catwrap{grid-template-columns:1fr; gap:32px} }

/* the hero console: the whole product, wider than the text above it */

.builds{margin-top:20px; border-top:1px solid var(--g150); border-bottom:1px solid var(--g150)}
.bl-r{display:grid; grid-template-columns:minmax(0,1fr) 264px; gap:32px;
      align-items:baseline; padding:24px 0; border-bottom:1px solid var(--g100)}
.bl-r:last-child{border-bottom:0}
.bl-t h4{font-size:22px; letter-spacing:-.015em}
.bl-t p{font-size:15px; line-height:1.55; color:var(--g650); margin-top:8px; max-width:52ch}
.bl-w{font-size:15px}
.bl-n{display:block; font-size:15px; color:var(--g550); margin-top:4px}

/* the developer centre's styles left with it; the public developer site is at ../developers/ */

/* ══ THE PORTALS · chrome ═════════════════════════════════════════════
   Three portals, one chrome. Sidebar on Base Light, content white, mark in
   Primary, selection in the system's one language. Two weights: the
   person's name and the screen's title take 600. */
.sb{width:240px; flex:none; background:var(--base-lt); padding:20px 12px 16px; display:flex; flex-direction:column; position:sticky; top:var(--top-h); height:calc(100vh - var(--top-h) - var(--rail-h,0px)); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin}
.sb-mark{display:flex; align-items:center; gap:12px; padding:0 12px 28px; font-size:13px; color:var(--g650); letter-spacing:-.01em}
.sb-mark i{width:22px; height:22px; border-radius:6px; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; font-style:normal; flex:none}
.sb-mark span{font-weight:600; color:var(--g900)}
.ws{display:flex; align-items:center; gap:12px; padding:8px 12px 24px}
.ws i{width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; font-style:normal; flex:none}
.ws .nm{font-size:15px; font-weight:600; line-height:1.2; min-width:0}
.ws .nm span{display:block; font-size:13px; font-weight:400; color:var(--g550); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sb nav{display:flex; flex-direction:column; gap:4px}
.sb nav a{display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:var(--r-part); font-size:15px; color:var(--g650); cursor:pointer}
.sb nav a .i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none}
.sb nav a:hover{background:var(--g100)}
.sb nav a.on{background:var(--blue100); color:var(--navy)}
.sb nav a .ct{margin-left:auto; font-size:13px; color:var(--g550)}
.sb nav a.on .ct{color:var(--navy)}
.sb-foot{display:none} /* the header carries the organisation and its status */
.sb-foot b{display:block; font-weight:400}
.sb-foot span{display:block; font-size:13px; color:var(--g550); margin-top:2px}
.mn{padding:0 48px 64px; max-width:1180px}
.para{font-size:15px; line-height:1.6; color:var(--g650); margin-top:16px; max-width:64ch}
.gn-toast{bottom:150px; /* above the story rail; the system's fixed toast sits at 28px */
       transition:opacity .2s ease, transform .2s ease; pointer-events:none; max-width:560px; line-height:1.45}
.gn-toast:empty{display:none}
.gn-toast .u{color:#fff; text-decoration:underline; text-underline-offset:3px; cursor:pointer; white-space:nowrap}

/* status is a coloured word */

/* ── rows: the workhorse ─────────────────────────────────────────────── */
/* rows carry the same 24px inset as a filled container, so list copy and
   container copy sit on one line. Inside a container the container's own
   padding is the inset, and the rows go back to the edge. */
/* a row takes however many parts it is given — a title, an optional middle
   value, a right side, and an action beneath. As a two-column grid the third
   part wrapped onto its own line, which is how the agent's book broke. */
/* fixed columns on the right: a status word, then an action. Nothing floats. */
.gn-row .gn-row-r > .gn-btn,.gn-row .gn-row-r > .gn-link{min-width:112px; justify-content:flex-end}
.gn-row .gn-row-r > .gn-num{min-width:80px; text-align:right}
.gn-row .hit{position:absolute; inset:0; cursor:pointer}
.gn-row.is-now .gn-row-t b{color:var(--g900)}
.gn-rows.cfg .gn-row-m{flex:1.2}
.gn-rows.cfg .gn-row-m .gn-mono{color:var(--g900)}
.turn{text-align:right; font-size:13px; color:var(--g550)}
.turn b{display:block; font-weight:400; font-size:15px; color:var(--g900)}
.turn b.mine{color:var(--sig)}
.since{min-width:64px; text-align:right}

/* ── a document: label, value, provenance ─────────────────────────── */
/* the portals inset the document 24px like their rows; the system's default is flush */

.gn-doc{padding-left:24px; padding-right:24px}
.gn-doc-s{margin-top:6px}
.gn-doc-groups .gn-doc{padding:16px 24px 8px}
/* a fact the network observed rather than was told: nobody typed it */
.gn-doc-groups.compact{grid-template-columns:1fr; gap:0}
.gn-doc-groups.compact .gn-doc{grid-template-columns:1fr; gap:12px}
.have .gn-doc-r{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.rec-h{display:flex; align-items:baseline; gap:12px; font-size:15px; margin-top:16px}
.rec-h b{font-weight:600} .rec-h span{font-size:13px; color:var(--g550)}

/* figures that argue */
.fr .gn-figs{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 24px}

/* notes the screen itself makes: what just happened, or what someone said */
.done,.note2{margin-top:24px; padding:20px 24px; background:var(--g025); border-radius:var(--r-part); font-size:15px; line-height:1.5}
.done b,.note2 b{font-weight:600; display:block}
.done span,.note2 span{display:block; color:var(--g650); margin-top:4px}
.note2 b{display:inline; margin-right:6px}

/* the form the record bends for */
.gn-ask .gn-field,.req .gn-field{margin-top:16px}
.req .gn-in{width:100%; background-color:var(--white)}
.fr .gn-ask{background:var(--white); padding:20px; max-width:none}
.fr .gn-ask-h b{font-size:15px} .fr .gn-ask-h span{font-size:13px} .fr .gn-ask .gn-field{margin-top:12px}

/* the request that arrives answered */
.req{margin-top:24px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.req-h b{display:block; font-size:22px; letter-spacing:-.015em; font-weight:600}
.req-h span{display:block; font-size:15px; color:var(--g650); margin-top:6px}
.have{margin-top:20px; font-size:15px; padding:0 24px}
.have summary{cursor:pointer; color:var(--navy)}
.have .more{font-size:13px; color:var(--g550); padding:12px 0}
.req .done{margin-top:16px}

/* credentials, on ink */
.cred{margin-top:24px; background:var(--base-dk); color:#fff; border-radius:var(--r-surface); padding:20px; max-width:560px}
.cred-k{font-size:13px; color:var(--burst-lt); letter-spacing:.04em; text-transform:uppercase; padding-bottom:12px}
.cred-r{display:flex; flex-direction:column; gap:4px; padding:12px 0; font-size:13px; border-top:1px solid rgba(255,255,255,.12)}
.cred-r span{color:rgba(255,255,255,.55)} .cred-r .gn-mono{color:#fff; overflow-wrap:anywhere}
.cred-f{margin-top:12px; font-size:13px; color:rgba(255,255,255,.55); line-height:1.5}
.fr .cred{max-width:none}

/* code on ink */
.gn-code--ink{margin-top:16px;
     font-family:var(--code); font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere}
.gn-code--ink.sm{padding:16px 20px; margin-top:12px}
.run{margin-top:16px}
.run-out{margin-top:16px}
.run-h{display:flex; align-items:baseline; gap:16px; font-size:15px}
.run-h > span:first-child{font-family:var(--code); font-size:13px}

/* the specification: endpoints on the left, one open on the right */
.spec{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:48px; margin-top:32px; align-items:start}
.spec-n h6{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase; font-weight:400; padding:16px 0 8px}
.spec-n a{display:grid; grid-template-columns:44px minmax(0,1fr); gap:8px; padding:8px 12px; border-radius:var(--r-part); font-size:13px; cursor:pointer; color:var(--g650)}
.spec-n a:hover{background:var(--g050)} .spec-n a.on{background:var(--blue100); color:var(--navy)}
.spec-n .mv{font-family:var(--code)} .spec-n .pv{font-family:var(--code); overflow-wrap:break-word}
.spec-d h2{font-size:28px; letter-spacing:-.02em}
@media (max-width:1000px){ .spec{grid-template-columns:1fr; gap:24px} }

/* the sandbox: cards on the left, the call and its answer on the right */
.sbx{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:48px; align-items:start}
.sbx .gn-section{margin-top:32px}
@media (max-width:1100px){ .sbx{grid-template-columns:1fr} }

/* what the network caught: one account, four lines, a close */
.al{margin-top:24px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.al-h{display:flex; align-items:baseline; gap:16px}
.al-h b{display:block; font-size:22px; letter-spacing:-.015em; font-weight:600}
.al-h > div > span{display:block; font-size:13px; color:var(--g550); margin-top:4px}
.al-h .gn-status{margin-left:auto; font-size:15px}
.al p{font-size:15px; line-height:1.6; color:var(--g650); margin-top:16px; max-width:64ch}
.al-s{margin-top:20px; border-top:1px solid var(--g150)}
.al-s > div{display:grid; grid-template-columns:96px minmax(0,1fr); gap:24px; padding:12px 0; border-bottom:1px solid var(--g100); font-size:15px}
.al-s b{font-weight:400; color:var(--g900); font-variant-numeric:tabular-nums} .al-s span{color:var(--g650)}
.al-f{margin-top:16px; font-size:15px; color:var(--g900)}
.al.live{background:linear-gradient(90deg, var(--bad) 0 3px, var(--g025) 3px)}
.al.fixed{background:linear-gradient(90deg, var(--good) 0 3px, var(--g025) 3px)}

/* ══ the frames: one moment, two or three portals ═════════════════════ */
.frs{display:grid; gap:24px; margin-top:32px; align-items:start}
.frs.n2{grid-template-columns:repeat(2,minmax(0,1fr))} .frs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fr{background:var(--g025); border-radius:var(--r-surface); min-width:0; overflow:hidden}
.fr-h{display:flex; align-items:baseline; gap:16px; padding:12px 20px; background:var(--base-lt); border-bottom:1px solid var(--g150); font-size:13px}
.fr-p{color:var(--g900); font-weight:600; white-space:nowrap}
.fr-v{color:var(--g550); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.fr-s{margin-left:auto; color:var(--g550); white-space:nowrap}
.fr-w{display:flex; align-items:center; gap:12px; padding:16px 20px 0; font-size:15px}
.fr-w i{width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:600; font-style:normal}
.fr-w b{font-weight:600; white-space:nowrap} .fr-w span{font-size:13px; color:var(--g550); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0} .fr-w .fr-st{margin-left:auto; flex:none}
.fr .tiles{grid-template-columns:1fr; gap:8px} .fr .tile{padding:12px 16px}
.fr-b{padding:0 20px 20px}
/* a section head's right side never shrinks, so the title gives way first; the system's 15px link is 18px wider than the old 13px word */
.gn-section h2{min-width:0}
.gn-chartcard .gn-chart-h b{font-size:22px} /* a chart card's figure is a caption to its chart, not a page figure. gn.css should carry this: .gn-chart-h b at --gn-type-subhead inside .gn-chartcard */
.gn-section > span{flex:none}
/* the system puts 16px after a section head; a row list carries its own top padding, so it sits tight to the rule as it always did */
.gn-section + .gn-doc,.gn-section + .dt-l,.gn-section + .fts,.gn-section + .prm,.gn-section + .gn-rows,.gn-section + .sbx{margin-top:0}
.fr .gn-section{margin-top:24px} .fr .gn-section h2{font-size:15px}
.fr .gn-rows .gn-row{padding:12px 12px; margin:0 -12px}
.fr .gn-empty{margin-top:16px; background:var(--white)}
.fr .note2,.fr .done{background:var(--white)}
.fr .gn-seg{margin-top:16px}
.fr .rec-h.mg{margin-top:16px}
@media (max-width:1180px){ .frs.n3,.frs.n2{grid-template-columns:1fr} }

@media (prefers-reduced-motion:no-preference){
  .cred,.al,.done,.livebar,.run-out{animation:arrive .45s cubic-bezier(.2,.6,.2,1) both}
  @keyframes arrive{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
}


/* ══ the deal · a proposal, prepared by a person ═════════════════════
   Dana's first real look at the network. A masthead, a headline in her
   numbers, a note from Sonia in Sonia's voice, and one ink surface that
   carries the three figures the page exists to show. Then the plan as a
   picture. It was four lists. */
.deal{max-width:920px}
.deal-m{display:flex; justify-content:space-between; gap:24px; padding:36px 0 0; font-size:13px; color:var(--g550)}
.deal-h{font-size:64px; letter-spacing:-.035em; line-height:1.02; margin-top:40px; text-wrap:balance}
.deal-h .mute{color:var(--g550)}
.deal-p{font-size:22px; letter-spacing:-.015em; line-height:1.45; color:var(--g650); margin-top:20px; max-width:40ch}
.deal-note{display:grid; grid-template-columns:32px minmax(0,1fr); gap:16px; margin-top:40px; padding:24px 0; border-top:1px solid var(--g150); border-bottom:1px solid var(--g150)}
.deal-note i{width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; font-style:normal}
.deal-note p{font-size:15px; line-height:1.65; color:var(--g900); max-width:64ch}
.deal-note b{display:block; margin-top:12px; font-size:13px; font-weight:400; color:var(--g550)}
.offer{margin-top:40px; background:var(--base-dk); color:#fff; border-radius:var(--r-surface); padding:24px;
       box-shadow:0 2px 4px rgba(0,2,38,.06), 0 24px 56px rgba(0,2,38,.16)}
.offer-k{font-size:13px; color:var(--burst-lt); letter-spacing:.04em; text-transform:uppercase}
.offer-g{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px; margin-top:24px}
.of b{display:block; font-size:28px; letter-spacing:-.02em; line-height:1.05; font-weight:600; font-variant-numeric:tabular-nums}
.of span{display:block; font-size:15px; color:var(--burst-lt); margin-top:8px}
.of p{font-size:13px; line-height:1.55; color:rgba(255,255,255,.62); margin-top:12px}
.offer-f{margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,.14); font-size:13px; color:rgba(255,255,255,.62); line-height:1.5}
.deal .gn-section{margin-top:48px}
.deal-c{display:flex; align-items:center; gap:32px; margin-top:48px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.deal-c > div{flex:1; min-width:0}
.deal-c b{display:block; font-size:22px; letter-spacing:-.015em; font-weight:600}
.deal-c span{display:block; font-size:15px; color:var(--g650); margin-top:6px; line-height:1.5}
.deal-c .gn-btn{flex:none}
.deal-c.done2{display:block}
@media (max-width:1100px){ .deal-h{font-size:40px} .offer-g{grid-template-columns:1fr; gap:24px} .deal-c{flex-direction:column; align-items:flex-start} }

/* the plan as two tracks across nine weeks: what runs in parallel is the
   point, and a list cannot show it */
.tl2{margin-top:24px; font-size:15px}
.tl2-h,.tl2-r{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr) 120px; gap:0 24px; align-items:center}
.tl2-h{font-size:13px; color:var(--g550); padding-bottom:8px; border-bottom:1px solid var(--g150)}
.tl2-h .tl2-w{display:grid; grid-template-columns:repeat(9,minmax(0,1fr))}
.tl2-h .tl2-w span{text-align:center}
.tl2-r{padding:12px 0; border-bottom:1px solid var(--g100)}
.tl2-l{min-width:0} .tl2-l small{display:block; font-size:13px; color:var(--g550); margin-top:2px}
.tl2-r .tl2-w{display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); height:12px;
              background:repeating-linear-gradient(90deg, transparent 0 calc(100%/9 - 1px), var(--g100) calc(100%/9 - 1px) calc(100%/9))}
.tl2-r .tl2-w i{grid-column:var(--s) / span var(--n); height:12px; border-radius:2px; background:var(--g400)}
.tr-biz .tl2-w i{background:var(--primary)} .tr-tech .tl2-w i{background:var(--burst-lt)} .tr-both .tl2-w i{background:var(--burst)}
.tl2-d{font-size:13px; color:var(--g550); text-align:right}
.tl2-k{display:flex; gap:24px; padding-top:12px; font-size:13px; color:var(--g550)}
.tl2-k span::before{content:''; display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:8px; vertical-align:-2px}
.k-biz::before{background:var(--primary)} .k-tech::before{background:var(--burst-lt)} .k-both::before{background:var(--burst)}
@media (max-width:900px){ .tl2-h,.tl2-r{grid-template-columns:minmax(0,1fr) 100px} .tl2-h .tl2-w,.tl2-r .tl2-w{display:none} }


/* ══ your team at Discover ═══════════════════════════════════════════
   People, not a directory. Sonia is a card because she is the relationship;
   the others are rows with faces. Contact details are plain text a person
   can copy, and the two actions are the two things Dana would do. */
.dt-av{width:40px; height:40px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center;
       font-size:15px; font-weight:600; font-style:normal; flex:none}
.dt-av.lg{width:64px; height:64px; font-size:22px}
.dt-lead{display:grid; grid-template-columns:64px minmax(0,1fr); gap:24px; margin-top:32px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.dt-b b{display:block; font-size:22px; letter-spacing:-.015em; font-weight:600}
.dt-r{display:block; font-size:15px; color:var(--g550); margin-top:4px}
.dt-b p{font-size:15px; line-height:1.6; color:var(--g650); margin-top:12px; max-width:60ch}
.dt-c{display:flex; flex-wrap:wrap; gap:8px 24px; margin-top:16px; font-size:15px}
.dt-c a{color:var(--navy)} .dt-c span{color:var(--g650)}
.dt-a{display:flex; gap:12px; margin-top:24px}
.dt-l{border-top:1px solid var(--g150)}
.dt-p{display:grid; grid-template-columns:40px minmax(0,1fr); gap:20px; padding:24px 0; border-bottom:1px solid var(--g100)}
.dt-p .dt-b b{font-size:15px; font-weight:400}
.dt-p .dt-r{font-size:13px; margin-top:2px}
.dt-p .dt-b p{margin-top:8px; font-size:15px}
.dt-p .dt-c{font-size:13px; margin-top:10px}
@media (max-width:800px){ .dt-lead{grid-template-columns:1fr} }


/* ══ the deal, before confirmation: no sidebar, the team beside it ═════
   Rich: eliminate the nav for this view; the team in a container on the
   left; Sonia's note in a container with a way to respond. */
body.nonav .sb{display:none}
body.nonav .mn{max-width:none; padding:0 48px 64px}
.dtop{display:flex; align-items:center; gap:40px; font-size:15px}
.dtop-m{display:flex; align-items:center; gap:12px; font-weight:600}
.dtop-m i{width:22px; height:22px; border-radius:6px; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; font-style:normal}
.dtop-m em{font-style:normal; font-weight:400; color:var(--g550)}
/* the same links as the public site, in its style, left against the mark */
.dtop-n{display:flex; gap:24px; font-size:15px; color:var(--g650)}
.dtop-n span{cursor:pointer} .dtop-n span:hover{color:var(--g900)}
.dtop-w{margin-left:auto; display:flex; align-items:center; gap:12px}
.dtop-w .nm{line-height:1.2} .dtop-w .nm em{display:block; font-style:normal; font-size:13px; color:var(--g550)}
.dtop-w .gn-link{margin-left:16px; font-size:15px}
@media (max-width:900px){ .dtop-n{display:none} }
@media (max-width:640px){ .dtop-w .nm{display:none} .dtop{gap:16px} }
.dtop-w i{width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; font-style:normal}
.deal2{display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:64px; align-items:start; margin-top:16px}
.deal2 .deal{max-width:880px}
.deal2 .deal-m{padding-top:28px}

.dside{position:sticky; top:calc(var(--dtop,73px) + 24px); margin-top:24px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.ds-h{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase; display:flex; justify-content:space-between}
.ds-h.mt{margin-top:28px; padding-top:20px; border-top:1px solid var(--g150)}
.ds-lead{display:flex; align-items:center; gap:12px; margin-top:16px}
.ds-lead b{display:block; font-size:15px; font-weight:600} .ds-lead span{display:block; font-size:13px; color:var(--g550)}
.ds-c{display:flex; flex-direction:column; gap:4px; margin-top:12px; font-size:13px}
.ds-c a{color:var(--navy)} .ds-c span{color:var(--g650)}
.ds-a{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.ds-p{display:grid; grid-template-columns:32px minmax(0,1fr); gap:12px; padding:16px 0; border-bottom:1px solid var(--g100)}
.ds-p:last-of-type{border-bottom:0}
.dt-av.sm{width:32px; height:32px; font-size:13px}
.ds-p b{display:block; font-size:15px; font-weight:400} .ds-p span{display:block; font-size:13px; color:var(--g550)}
.ds-p p{font-size:13px; color:var(--g650); line-height:1.5; margin-top:6px}
.ds-p a{display:block; font-size:13px; color:var(--navy); margin-top:6px; overflow-wrap:anywhere}
.ds-f{margin-top:12px}
.ds-f > div{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:12px; padding:8px 0; border-bottom:1px solid var(--g100); font-size:13px}
.ds-f span{color:var(--g550)} .ds-f b{font-weight:400}
.ds-n{font-size:13px; color:var(--g550); line-height:1.5; margin-top:12px}

/* the note, as a conversation */
.nc{margin-top:40px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.nc-m{display:flex; align-items:center; gap:12px}
.nc-m i{width:36px; height:36px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; font-style:normal}
.nc-m b{display:block; font-size:15px; font-weight:600} .nc-m span{display:block; font-size:13px; color:var(--g550)}
.nc > p{font-size:15px; line-height:1.65; margin-top:16px; max-width:64ch}
.nc-reply{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:end; margin-top:20px; padding-top:20px; border-top:1px solid var(--g150)}
.nc-reply .gn-in{width:100%; resize:vertical; background-color:var(--white); border:1px solid var(--g200); border-radius:var(--r-part); padding:12px 16px; font:inherit; font-size:15px; line-height:1.5}
.nc-reply .gn-in:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(49,68,183,.14)}
.nc-sent{display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; margin-top:20px; padding-top:20px; border-top:1px solid var(--g150)}
.nc-sent i{width:36px; height:36px; border-radius:50%; background:var(--burst); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:600; font-style:normal}
.nc-sent p{font-size:15px; line-height:1.6} .nc-sent b{display:block; font-size:13px; font-weight:400; color:var(--g550); margin-top:8px}
@media (max-width:1100px){ .deal2{grid-template-columns:1fr; gap:32px} .dside{position:static; order:2} }


/* ══ faces ═══════════════════════════════════════════════════════════
   One element for a person, at six sizes. A photograph where the build has
   one; initials on Primary where it does not. Round, because the rest of the
   system is square. */
.av{width:28px; height:28px; border-radius:50%; object-fit:cover; flex:none; display:grid; place-items:center;
    background:var(--primary); color:#fff; font-size:13px; font-weight:600; font-style:normal; vertical-align:middle}
.av.a24{width:24px; height:24px; font-size:11px} .av.a26{width:26px; height:26px; font-size:11px}
.av.a28{width:28px; height:28px} .av.a32{width:32px; height:32px} .av.a36{width:36px; height:36px}
.av.a40{width:40px; height:40px; font-size:15px} .av.a64{width:64px; height:64px; font-size:22px}
.ws .av,.ws i{width:28px; height:28px}
/* the rail's seat marks hold a face; the ring says which seats are on screen */
.rail .who .p.ph2{padding:0; border:2px solid var(--g150); background:var(--white); width:30px; height:30px; overflow:hidden}
.rail .who .p.ph2.on{border-color:var(--primary); background:var(--white)}
.rail .who .p.ph2 .av{width:26px; height:26px}

/* the top bar on the deal view stays put and the page scrolls beneath it */
.dtop{position:sticky; top:0; z-index:5; background:var(--white); margin:0 -48px; padding:20px 48px; border-bottom:1px solid var(--g100)}
.deal2{margin-top:0}

/* metadata sits in spaced spans, not behind dots */
.meta{display:inline-flex; flex-wrap:wrap; gap:0 16px}

.fr .gn-row,.dside .gn-row,.nc .gn-row,.al .gn-row,.gn-ask .gn-row,.req .gn-row,.fr .gn-rows--compact .gn-row{padding-left:0; padding-right:0}
.fr .gn-doc-r,.req .gn-doc-r,.have .gn-doc-r,.dside .gn-doc-r{padding-left:0; padding-right:0}
.fr .gn-doc-groups section h3{padding-left:0; padding-right:0}
.fr .gn-row.is-bad{padding-left:16px}


/* ══ one inset, one measure ═══════════════════════════════════════════
   Everything that carries copy at page level sits 24px in from the column
   edge: headings, rows, document lines, the header block, the chart's
   labels. Hairlines and filled surfaces run the full column. Copy under a
   heading takes 8 of the column's 12 parts — a measure derived from the
   layout rather than a character count guessed per element. */
.gn-section,.gn-page-head,.para,.deal-m,.deal-h,.deal-p,.gn-figs{padding-left:24px; padding-right:24px}
.tl2-h,.tl2-r{padding-left:24px; padding-right:24px}
.tl2-k{padding-left:24px}
/* product, not marketing: copy runs 10 of 12 parts. In the 880px deal column
   that is 733px — about 57 characters at the 22px deck, 80 at body size. */
.gn-page-head p,.deal-p,.para,.nc > p,.dt-b p{max-width:calc(100% * 10 / 12)}
.deal-c > div span{max-width:none}
.fr .gn-section,.fr .gn-page-head,.fr .para,.fr .gn-figs,.dside .gn-section{padding-left:0; padding-right:0}


/* the offer answers the switches */

/* a switch: in the deal, or not. Burst when on, like everything selected. */
.tog{width:36px; height:20px; border-radius:999px; background:var(--g200); border:0; position:relative; cursor:pointer; flex:none; padding:0}
.tog i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--white); transition:left .15s ease}
.tog.on{background:var(--burst)} .tog.on i{left:18px}
.tog:focus-visible{outline:2px solid var(--burst); outline-offset:2px}
.tog-l{font-size:13px; color:var(--g550); width:96px; text-align:right}
/* the deal's Add and Remove: a small button with its label centred, not the row's 112px right-justified control (gn.css .gn-row-r > .gn-btn), which read as stretched */
.gn-row .gn-row-r > .tog-b{width:96px; min-width:0; justify-content:center; padding:0 12px}
.tog-more{width:88px; text-align:left; margin-right:8px}

/* a row opened in place: the product's today, on the network, for merchants */
.gn-row.open{background:var(--g025)}
.gn-row-x{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; padding:12px 0 8px}
.gn-row-x b{display:block; font-size:13px; color:var(--g550); font-weight:400; margin-bottom:6px}
.gn-row-x p{font-size:15px; line-height:1.55}



/* try the sandbox: a quiet band between the figures and the products */
.sbx-c{display:flex; align-items:center; gap:32px; margin-top:24px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.sbx-c > div:first-child{flex:1; min-width:0}
.sbx-c b{display:block; font-size:15px; font-weight:600}
.sbx-c > div > span{display:block; font-size:15px; color:var(--g650); margin-top:4px}
.sbx-a{display:flex; align-items:center; gap:20px; flex:none}
.sbx-f{display:flex; gap:8px; align-items:center}
.sbx-f .gn-in{height:32px; width:240px; padding:0 12px; border:1px solid var(--g200); border-radius:var(--r-small); font:inherit; font-size:13px; background-color:var(--white)}
.sbx-f .gn-in:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(49,68,183,.14)}
.sbx-sent{font-size:13px; color:var(--good)}
.back{padding:24px 24px 0; font-size:15px}
@media (max-width:900px){ .sbx-c{flex-direction:column; align-items:flex-start} }


/* ══ getting started ══════════════════════════════════════════════════
   Where Brightline stands and the one thing to do next, then every item
   in the groups a company would hand them out in. A row says what it is,
   what it gates, whose turn, when, and has one action. Done rows stay. */
.gs-p{display:grid; grid-template-columns:minmax(0,200px) minmax(0,1fr); gap:16px 32px; align-items:center; margin-top:32px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.gs-n b{display:block; font-size:22px; letter-spacing:-.02em; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.gs-n > span{display:block; font-size:13px; color:var(--g550); margin-top:6px}
.gs-bar{height:6px; border-radius:3px; background:var(--g150); overflow:hidden}
.gs-bar i{display:block; height:100%; width:var(--w); background:var(--burst); border-radius:3px; transition:width .5s cubic-bezier(.2,.7,.2,1)}
.gs-next{grid-column:1 / -1; display:flex; align-items:center; gap:16px; padding-top:16px; border-top:1px solid var(--g150); font-size:15px}
.gs-next > span{font-size:13px; color:var(--g550)} .gs-next b{font-weight:600} .gs-next .gn-btn{margin-left:auto}
.gate{display:block; font-style:normal; color:var(--g550); margin-top:2px}
.gn-row .due{min-width:96px; text-align:right}
.gn-row.is-done .gate{display:none}
.gs-f{margin-top:32px; padding:0 24px; font-size:15px; color:var(--g650)}
.fr .gs-p{margin-top:16px; padding:16px; background:var(--white); grid-template-columns:1fr; gap:12px}
.fr .gs-n b{font-size:22px} .fr .gs-next{padding-top:12px; flex-wrap:wrap; gap:8px 12px}
.fr .gn-ask{margin-top:16px}
@media (max-width:900px){ .gs-p{grid-template-columns:1fr} }


/* ══ getting started, as a guide ═══════════════════════════════════════
   A person at the top, a stepper, then the current step as the page: why
   it matters, what you will need, who is involved, the action. Done folds
   above it, coming up folds below. It was a list. */
.guide{display:grid; grid-template-columns:40px minmax(0,1fr); gap:16px; margin-top:32px; padding:0 24px}
.guide p{font-size:15px; line-height:1.6; max-width:calc(100% * 10 / 12)}
.guide > div > span{display:block; font-size:13px; color:var(--g550); margin-top:8px}
.guide .gn-link{margin-left:12px}
.stp{display:grid; grid-template-columns:repeat(var(--n,6),minmax(0,1fr)); gap:8px; margin:40px 0 0; padding:0 24px; list-style:none; position:relative}
.stp li{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; font-size:13px; color:var(--g550); position:relative}
.stp li i{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:13px; font-weight:600;
          background:var(--white); border:1px solid var(--g200); color:var(--g550); z-index:1}
.stp li i svg{width:14px; height:14px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.stp li.s-done i{background:var(--primary); border-color:var(--primary)}
.stp li.s-cur i{border-color:var(--burst); color:var(--burst); box-shadow:0 0 0 3px rgba(49,68,183,.14)}
.stp li.s-cur{color:var(--g900); font-weight:600}
.stp.n2{--n:2} .stp.n3{--n:3} .stp.n4{--n:4} .stp.n5{--n:5} .stp.n6{--n:6}
.stp li::before{content:''; position:absolute; top:14px; left:-50%; width:100%; height:1px; background:var(--g150)}
.stp li:first-child::before{display:none}
.stp li.s-done::before,.stp li.s-cur::before{background:var(--primary)}
.just{margin-top:32px; padding:20px 24px; background:var(--blue100); font-size:15px} /* filled strips are square */
.just b{display:block; font-weight:600; color:var(--navy)} .just > span{display:block; margin-top:4px; color:var(--g650)}
.sc{margin-top:32px; padding:32px; background:var(--g025); border-radius:var(--r-surface)}
.sc-k{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase}
.sc-h h2{font-size:28px; letter-spacing:-.02em; margin-top:8px}
.sc-h p{font-size:15px; line-height:1.6; color:var(--g650); margin-top:12px; max-width:calc(100% * 10 / 12)}
.sc-g{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:32px; margin-top:24px; padding-top:24px; border-top:1px solid var(--g150)}
.sc-l{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase; margin-bottom:12px}
.sc-n{list-style:none; padding:0; margin:0}
.sc-n li{font-size:15px; line-height:1.55; padding:8px 0 8px 20px; position:relative; border-bottom:1px solid var(--g100)}
.sc-n li:last-child{border-bottom:0}
.sc-n li::before{content:''; position:absolute; left:0; top:15px; width:6px; height:6px; border-radius:50%; background:var(--burst)}
.sc-p{display:flex; align-items:center; gap:4px} .sc-p .av{margin-right:-6px; border:2px solid var(--g025)} .sc-p span{margin-left:14px; font-size:15px}
.sc-a{margin-top:24px; display:flex; align-items:center; gap:20px}
.sc .gn-ask{margin-top:24px; padding:0; background:transparent; max-width:none}
.sc .gn-ask-h{display:none}
.sc .gn-ask .gn-field{margin-top:12px}
.sc .gn-ask{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 24px}
.sc .gn-ask .gn-form-act{grid-column:1 / -1}
.sc.compact{padding:16px; margin-top:16px; background:var(--white)}
.sc.compact .sc-h h2{font-size:15px; margin-top:4px} .sc.compact .sc-h p{font-size:13px; max-width:none}
.sc.compact .sc-g{display:none}
.sc.compact .sc-a .gn-link{display:none}
.sc.compact .gn-ask{grid-template-columns:1fr}
.fr .stp,.fr .guide{display:none}
@media (max-width:1000px){ .stp{grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px 8px} .stp li::before{display:none} .sc-g{grid-template-columns:1fr} .sc .gn-ask{grid-template-columns:1fr} }


/* ══ getting started: five journeys ════════════════════════════════════
   A card per phase, sized to be read in a glance: the phase numeral, a dot
   per step so progress is visible before you read anything, the promise,
   one way in. No illustration — this system does not decorate, and the
   dots carry more than a picture would. */
.gc-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:24px}
.gc{background:var(--white); border:1px solid var(--g150); border-radius:var(--r-surface); overflow:hidden; display:flex; flex-direction:column}
.gc-h{display:flex; align-items:center; gap:12px; padding:16px 20px; background:var(--g025); border-bottom:1px solid var(--g150)}
.gc-num{font-size:22px; letter-spacing:-.015em; font-weight:600; color:var(--g400); font-variant-numeric:tabular-nums; line-height:1}
.gc-dots{display:flex; gap:8px}
.gc-dots i{width:8px; height:8px; border-radius:50%; background:var(--g200); display:block}
.gc-dots i.d-done{background:var(--primary)}
.gc-dots i.d-now{background:var(--burst); box-shadow:0 0 0 3px rgba(49,68,183,.16)}
.gc-ct{margin-left:auto; font-size:13px; color:var(--g550); font-variant-numeric:tabular-nums}
.gc-b{padding:20px; display:flex; flex-direction:column; gap:8px; flex:1}
.gc-b h2{font-size:22px; letter-spacing:-.015em; line-height:1.2}
.gc-b p{font-size:15px; line-height:1.5; color:var(--g650); flex:1}
/* the active phase names its next step, so the hub answers "what do I do"
   without asking for a click */
.gc-next{display:flex; align-items:baseline; gap:8px; margin-top:4px; padding-top:12px; border-top:1px solid var(--g150); font-size:15px}
.gc-next span{font-size:13px; color:var(--g550)} .gc-next b{font-weight:600}
.gc-b .gn-btn{align-self:flex-start; margin-top:8px}
/* the active phase is the one the eye should land on */
.gc.is-lead{border-color:var(--g400)}
.gc.is-active .gc-h{background:var(--blue050)}
.gc.is-active .gc-num{color:var(--navy)}
.gc.is-complete .gc-num{color:var(--g200)}
.gc-k{font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase; margin-top:16px}
.fr .gc-k{margin-top:12px}
@media (max-width:1180px){ .gc-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .gc-grid{grid-template-columns:1fr} }


/* ══ direction, drawn ══════════════════════════════════════════════════
   The ← and → glyphs sat at the body font's weight and baseline, which put
   them at odds with the nav icons and the buttons. One drawn mark instead,
   on the same stroke language, aligned to the cap height. */
.mk{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px}
.gn-link--go{display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.gn-link--go .mk{transition:transform .18s cubic-bezier(.2,.6,.2,1)}
.gn-link--go:hover .mk{transform:translateX(2px)}
/* going back is a control, not a sentence: it sits above the title, aligned
   to the content edge, with a target you can actually hit */
.back{padding:24px 24px 0}
.blk{display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 8px; margin-left:-8px;
     border:0; background:transparent; border-radius:var(--r-small); font:inherit; font-size:15px;
     color:var(--g650); cursor:pointer}
.blk:hover{background:var(--g050); color:var(--g900)}
.blk .mk{stroke-width:1.8}
.dvh .blk{margin-top:24px; color:var(--g550)}

/* ══ focus, everywhere ═════════════════════════════════════════════════
   One ring, on the interactive colour, only for keyboard use. */
.gn-btn:focus-visible,.blk:focus-visible,.gn-link:focus-visible,.tog-b:focus-visible,
.sb nav a:focus-visible,.gn-seg button:focus-visible,.gc-b .gn-btn:focus-visible,
.gn-row .hit:focus-visible,.spec-n a:focus-visible,.have summary:focus-visible{
  outline:2px solid var(--burst); outline-offset:2px; border-radius:var(--r-small)}

/* ══ things that respond ═══════════════════════════════════════════════
   A card that can be entered says so before it is clicked; a row that has
   an action lifts on the tone the system already uses for hover. */
.gc{transition:border-color .16s ease, transform .16s ease}
.gc:hover{border-color:var(--g400)}
.gc.is-active:hover,.gc.is-lead:hover{border-color:var(--navy)}
.gc-dots i{transition:background .3s ease, box-shadow .3s ease}
/* a list read down a column needs its columns to line up */
.gn-rows.act .gn-row-m{min-width:88px; text-align:right}
.gn-rows.act .turn{min-width:104px}

/* ══ the sidebar, in two groups ════════════════════════════════════════
   What Brightline runs, then who and what governs it. The rule is the IA
   made visible: everything above it is the work, everything below is the
   account. */
.sb nav a.grp{margin-top:20px; padding-top:20px; position:relative}
.sb nav a.grp::before{content:''; position:absolute; top:0; left:12px; right:12px; height:1px; background:var(--g150)}

/* ══ the guide ═════════════════════════════════════════════════════════
   A person speaking, not a paragraph with a face beside it. */
.guide{align-items:start}
.guide p{color:var(--g900)}
.guide > div > span{display:flex; align-items:center; gap:12px; margin-top:10px}
.guide .gn-link{margin-left:0}
.guide .gn-link::before{content:''; width:1px; height:12px; background:var(--g200); display:inline-block; margin-right:12px; vertical-align:-1px}

/* ══ an empty state is a sentence, not a slab ══════════════════════════ */


/* the moment something lands: the same strip, in the good tone */
.just.ok{background:#E6F0E3} .just.ok b{color:var(--good)}
.fr .just{margin-top:16px; padding:16px}
.agr-h{display:flex; align-items:center; gap:24px; margin-top:16px; padding:0 24px}
.agr-h p{flex:1; font-size:15px; color:var(--g650); line-height:1.5}
.feas .gn-in{width:100%; background-color:var(--white); border:1px solid var(--g200); border-radius:var(--r-small); padding:12px 16px; font:inherit; font-size:15px; line-height:1.5; resize:vertical}
.sc .feas{grid-template-columns:1fr}


/* ══ the mature relationship ═══════════════════════════════════════════
   Tables where there are columns, tiles where there are three states, a
   chart where there are fourteen days. A filled row is square: it is the
   row, not a card sitting in the list. */
.tcell{display:flex; align-items:center; gap:12px}
.tcell b{display:block; font-weight:400} .tcell em{display:block; font-style:normal; font-size:13px; color:var(--g550)}
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:16px}
.tile{padding:20px 24px; background:var(--g025); border-radius:var(--r-surface); display:flex; flex-direction:column; gap:8px}
.tile-k{font-size:15px; font-weight:600}
.tile .gn-mono{color:var(--g650)}
.chart{margin-top:16px; padding:8px 24px 0}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart .g{stroke:var(--g200); stroke-width:1; stroke-dasharray:2 4}
.chart .yl{font-size:12px; fill:var(--g550); text-anchor:end; font-variant-numeric:tabular-nums}
.chart .xl{font-size:12px; fill:var(--g550)}
.chart .l{fill:none; stroke:var(--navy); stroke-width:1.75; stroke-linejoin:round}
.chart .a{fill:var(--navy); opacity:.06}
.chart .p{fill:var(--navy)}
.chart .pl{font-size:13px; fill:var(--g900); font-weight:600}
.pc-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:24px}
.pc{background:var(--white); border:1px solid var(--g150); border-radius:var(--r-surface); padding:20px; display:flex; flex-direction:column; gap:8px}
.pc-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.pc h2{font-size:22px; letter-spacing:-.015em} .pc.is-avail h2{font-size:15px} /* before go-live, the products not in the agreement recede */
.pc p{font-size:15px; line-height:1.5; color:var(--g650); flex:1}
.pc-m{display:grid; grid-template-columns:1fr; gap:8px; margin-top:8px; padding-top:12px; border-top:1px solid var(--g150)}
.pc-m b{font-size:22px; letter-spacing:-.015em; font-weight:600; display:block; font-variant-numeric:tabular-nums}
.pc-m span{font-size:13px; color:var(--g550)}
.pc-a{margin-top:8px}
.pc.is-live{border-color:var(--g200)}
.pdt{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px; margin-top:32px; padding:0 24px}
.pdt p{font-size:15px; line-height:1.6}
.pdt-g{padding:0 24px; border-top:0; margin-top:16px}
.sc-p.inset{padding:16px 24px 0}
.pd-n{font-size:15px; line-height:1.6} .pd-n b{font-weight:600}
.csum{display:grid; grid-template-columns:minmax(0,200px) minmax(0,1fr); gap:32px; align-items:start; margin-top:24px; padding:24px; background:var(--g025); border-radius:var(--r-surface)}
.csum-n b{display:block; font-size:28px; letter-spacing:-.02em; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.csum-n span{display:block; font-size:13px; color:var(--g550); margin-top:6px}
.csum-r{display:grid; grid-template-columns:minmax(0,160px) minmax(0,1fr) 64px; gap:16px; align-items:center; font-size:15px; padding:8px 0}
.csum-bar{height:8px; border-radius:2px; background:var(--g150); overflow:hidden}
.csum-bar i{display:block; height:100%; width:var(--w); background:var(--navy); border-radius:2px; transition:width .5s cubic-bezier(.2,.7,.2,1)}
.csum-bar i.bad{background:var(--bad)}
.csum-r .gn-num{text-align:right}
@media (max-width:1100px){ .pc-grid,.tiles,.pdt{grid-template-columns:1fr} .csum{grid-template-columns:1fr} }


/* ══ the evaluation pass ═══════════════════════════════════════════════
   An empty state is a sentence, not a slab. A message from a person has a
   face. A timeline has a rule. A table row can be picked. */
.gn-empty{margin-top:16px; padding:0 24px; background:transparent; border-radius:0; font-size:15px; color:var(--g550); line-height:1.55}
.fr .gn-empty{padding:0; background:transparent}
.msg{display:grid; grid-template-columns:36px minmax(0,1fr); gap:16px; margin-top:16px; padding:0 24px}
.msg-h b{font-weight:600} .msg-h span{margin-left:12px; font-size:13px; color:var(--g550)}
.msg p{font-size:15px; line-height:1.6; margin-top:6px; max-width:calc(100% * 10 / 12)}
.para-act{padding:16px 24px 0; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.tl{margin-top:8px; padding:0 24px}
.tl-d{position:relative; padding:24px 0 8px 28px}
.tl-d::before{content:''; position:absolute; left:6px; top:28px; bottom:0; width:1px; background:var(--g150)}
.tl-d .tl-m{display:block; font-size:13px; color:var(--g550); letter-spacing:.04em; text-transform:uppercase; margin-left:-28px; margin-bottom:8px}
.tl-i{display:grid; grid-template-columns:72px minmax(0,1fr) auto; gap:8px 24px; padding:16px 0; border-bottom:1px solid var(--g100); position:relative}
.tl-i::before{content:''; position:absolute; left:-25px; top:23px; width:7px; height:7px; border-radius:50%; background:var(--g200)}
.tl-i.hot::before{background:var(--sig)}
.tl-t{font-size:13px; color:var(--g550); font-variant-numeric:tabular-nums; padding-top:4px}
.tl-b b{display:block; font-size:15px; font-weight:400}
.tl-b p{font-size:15px; color:var(--g650); line-height:1.55; margin-top:4px; max-width:64ch}
.tl-b .al-s{margin-top:12px} .tl-b .al-f{margin-top:12px; font-size:15px}
.tl-r{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; justify-content:flex-end}
@media (max-width:760px){ .tl-i{grid-template-columns:1fr} .tl-r{justify-content:flex-start} }
.mine{color:var(--g900); font-weight:600} /* the partner card's Your turn: weight, not Heritage; three cards can say it on one screen */
.gtabs,.gn-seg.cgt{margin-top:24px}


/* ══ depth ═════════════════════════════════════════════════════════════
   A card that opens says so; a ranked bar is a proportion of a real whole. */
.pc.is-link{cursor:pointer} .pc.is-link:hover{border-color:var(--g400)}
.rank{margin-top:16px; padding:0 24px}
.rank-r{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr) 64px 48px; gap:16px; align-items:center; padding:8px 0; font-size:15px}
.rank-bar{height:10px; background:var(--g100); border-radius:2px; overflow:hidden}
.rank-bar i{display:block; height:100%; width:var(--w); background:var(--navy); border-radius:2px}

.hdr-r{display:flex; align-items:center; gap:4px; margin-left:auto}
.hdr-a{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:var(--r-part); font-size:15px; color:var(--g650); cursor:pointer; white-space:nowrap}
.hdr-a:hover{background:var(--g050); color:var(--g900)}
.hdr-a.on{color:var(--navy)}
.hdr-a .i{width:18px; height:18px; stroke-width:1.6}
.hdr-a .ct{font-size:13px; color:var(--g550)}
.hdr-a.needs .ct{color:var(--sig)}
.hdr-u{display:flex; align-items:center; gap:12px; height:40px; padding:0 8px 0 4px; margin-left:12px; border-radius:var(--r-part); cursor:pointer}
.hdr-u:hover{background:var(--g050)}
.hdr-u .nm{font-size:15px; line-height:1.2; white-space:nowrap}
.hdr-u .nm span{display:block; font-size:13px; color:var(--g550)}
.hdr-u .mk{color:var(--g400)}
.hdr-menu{position:relative}
.hdr-menu .gn-menu-panel{top:calc(100% + 4px); min-width:220px}
body.nonav .hdr-q,body.nonav .hdr-r .hdr-a{display:none}
@media (max-width:1100px){ .hdr-a .lb{display:none} .hdr-q form{width:min(280px,100%)} }
@media (max-width:760px){ .hdr{padding:0 16px; gap:16px} .hdr-org,.hdr-q{display:none} .hdr-u .nm{display:none} }

/* the frames connect to the portals they are views of: each carries the
   same header at frame size, and opens into that person's portal */
.fr-h{display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--white); border-bottom:1px solid var(--g150); font-size:13px}
.fr-h i.fm{width:20px; height:20px; border-radius:5px; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:600; font-style:normal; flex:none}
.fr-p{font-weight:600; color:var(--g900); white-space:nowrap}
.fr-v{color:var(--g550); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; padding-left:12px; border-left:1px solid var(--g150)}
.fr-s{margin-left:auto; color:var(--g550); white-space:nowrap}
.fr-h .gn-link{font-size:13px; white-space:nowrap; margin-left:auto}
.fr-w{display:flex; align-items:center; gap:12px; padding:16px 20px 0; font-size:15px}
.fr-w b{font-weight:600; white-space:nowrap} .fr-w span{font-size:13px; color:var(--g550); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0} .fr-w .fr-st{margin-left:auto; flex:none}
.fr .tiles{grid-template-columns:1fr; gap:8px} .fr .tile{padding:12px 16px}
.frs-h{display:flex; align-items:baseline; gap:16px; margin-top:24px; font-size:13px; color:var(--g550)}
.frs-h .p{display:inline-flex; gap:8px; align-items:center; margin-left:auto}

/* the dialog: hidden until asked, above everything that scrolls */
#dlg[hidden]{display:none}
#dlg{z-index:80} #scrim{z-index:70}

/* header search results: one panel under the field, grouped by object */
.hdr-res{left:0; right:0; top:calc(100% + 6px); max-height:60vh; overflow:auto; text-align:left; z-index:60; min-width:0}
.hdr-res[hidden]{display:none}
.hdr-res button{display:flex; flex-direction:column; gap:2px; width:100%; white-space:normal}
.hdr-res button b{font-weight:400; overflow-wrap:anywhere}
.hdr-res button span{font-size:13px; color:var(--g550)}
.hdr-res .gn-menu-h + .gn-menu-h{margin-top:4px}

/* keyboard: what the mouse can open, the keyboard can reach */
tr.is-link:focus-visible{outline:2px solid var(--navy); outline-offset:-2px}
.is-link:focus-visible,.gn-link:focus-visible{outline:2px solid var(--navy); outline-offset:2px; border-radius:var(--r-small)}
/* a narrow window: the sidebar becomes an icon rail with the label on hover, the group names go */
@media (max-width:900px){
  .sb{width:64px; padding:20px 8px 16px}
  .sb nav a{justify-content:center; padding:10px; gap:0; position:relative}
  .sb nav a .nl,.sb nav .ng{display:none}
  .sb nav a .ct{position:absolute; top:4px; right:6px; margin:0; font-size:11px; line-height:1}
  .sb nav a.grp{margin-top:12px; padding-top:22px} .sb nav a.grp::before{left:8px; right:8px}
  .sb nav .ng + a{margin-top:12px}
}

/* the first thing a keyboard reaches: skip the header and sidebar */
.skip{position:absolute; left:8px; top:-48px; z-index:100; background:var(--white); color:var(--navy); padding:8px 12px; border-radius:var(--r-small); box-shadow:0 8px 24px rgba(0,2,38,.10)}
.skip:focus{top:8px}

#mn h1:focus{outline:none}
/* read by assistive technology, never seen: the needs-you count and the offline banner announce here */
.gn-toast--fixed{bottom:calc(var(--rail-h, 0px) + 20px)}
#live{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

/* ── print: the record, not the chrome ──────────────────────────────────
   A transaction, a cycle or a case printed from the portal is the page
   content at full width, no header, sidebar, rail, toast or dialog, no
   shadows, rows kept whole, links as words. */
@media print{
  .hdr,.sb,#rail,.skip,.gn-toast,#dlg,#scrim,.hdr-res,.gn-menu-panel,.back,.gn-page-head-act,.sc-a,.gn-form-act,.gn-table-foot,.tb2{display:none!important}
  /* printed, a record is the record: no segments, buttons, forms or search chips, which only work on screen */
  .gn-seg,.gn-btn,form.gn-ask,.gn-thread-f,.gn-actions,.gn-chip,.chip{display:none!important}
  .p5-pick{display:grid!important; background:none!important} /* the plan's rows are the record, not a control, on paper */
  /* a wide table shows every column on Letter: heads wrap, cells sit tighter */
  .gn-table th{white-space:normal} .gn-table td,.gn-table th{padding-left:12px; padding-right:12px}
  .gn-cal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ag-notes:not(.has-note){display:none} /* a notes section with nothing written is a form, so it is not printed */
  .gn-rank-r,.gn-check-i,.gn-cal-w,.pp,.gn-person,.tile,.tl-i,.gn-tl-i{break-inside:avoid}
  body{background:#fff}
  .app-b{display:block}
  #mn{max-width:none; padding:0; width:100%}
  .gn-row,.gn-table tr,.gn-fig,.gn-doc-r,.gn-setup,.gn-notice,.gn-notice,.dsh,.pc{break-inside:avoid}
  .gn-section{break-after:avoid}
  .gn-chart svg{max-width:100%}
  *{box-shadow:none!important; transition:none!important}
  .gn-link{color:inherit; text-decoration:none}
  .gn-table-wrap{overflow:visible}
  .gn-table{min-width:0}
  .rv,.rv .split-t > *,.wmap .m{opacity:1!important; transform:none!important}
}

/* offline: a banner under the header, gone the moment the connection is back */
#offline[hidden]{display:none}
#offline{position:sticky; top:var(--top-h); z-index:15}

#sitebar .lks span:focus-visible, #siteBody [data-ft]:focus-visible{outline:2px solid var(--navy); outline-offset:2px; border-radius:var(--r-small)}


/* ── the shell switches chrome as the story moves ─────────────── */
#sitewrap{display:none}
#appwrap{display:none}
body.mode-site #sitewrap, body.mode-prep #sitewrap{display:block}
body.mode-pre #appwrap, body.mode-app #appwrap{display:flex}
#sitebar, #prepbar{display:none}
body.mode-site #sitebar{display:flex}
body.mode-prep #prepbar{display:flex}
</style>

/* Global Network design system — the chart library.
   Dependency-free SVG, drawn from data, in the language: dotted grid, values on
   the left, a dated axis, the last point labelled, chart hues only past one
   series. Every chart takes a container and an options object and returns the
   svg. Load after gn.css.

   GNChart.line(el,{labels, series:[{name,values}], prev, fmt, min, max, area, step, points, label})
   GNChart.area(el,o)  GNChart.step(el,o)
   GNChart.bar(el,{labels, series, stacked, horizontal, fmt, highlight, label})
   GNChart.donut(el,{items:[{name,value}], fmt, center, centerLabel})
   GNChart.gauge(el,{value, min, max, fmt, bands:[{to,tone}], label})
   GNChart.radar(el,{axes:[…], series:[{name,values}], max})
   GNChart.waterfall(el,{steps:[{label,value,total}], fmt})
   GNChart.histogram(el,{bins:[…], start, width, unit, marker:{value,label}, tail})
   GNChart.scatter(el,{points:[{x,y,r,name,series}], xfmt, yfmt, series:[names]})
   GNChart.heatmap(el,{rows, cols, values:[[…]], fmt})
   GNChart.funnel(el,{steps:[{name,value}], fmt})
   GNChart.bullet(el,{value, target, max, fmt, label})
   GNChart.treemap(el,{items:[{name,value}], fmt})
   GNChart.box(el,{groups:[{name,min,q1,med,q3,max}], fmt})
   GNChart.dumbbell(el,{items:[{name,a,b}], names:[a,b], fmt, max})
   GNChart.spark(el,{values})
   GNChart.week(el,{values, today})
   GNChart.key(el,[{name,hue|tone}], {toggles:svg})   click an item to hide its series
   GNChart.ring(el,{value,max,size,fmt,tone})    GNChart.rings(el,{items:[{name,value,max}]})
   GNChart.lollipop(el,{items:[{name,value}],fmt,max})
   GNChart.activity(el,{values:[…], start, cols})   a calendar of days
   GNChart.delta(value, {fmt, good:'up'|'down'})   returns markup for a change
   Every mark carries data-tip; one floating tooltip serves all charts. Line and area charts add a hover line.

 function dnum(s){ var m=/^(\d+)\s+([A-Za-z]+)/.exec(s||''); if(m) return (MON[m[2]]||0)*100+(+m[1]);

 /* ── the clock ──────────────────────────────────────────────────
    One "today" for every relative figure. The story is frozen at
    June 2, 2026; the rail moves NOW a day at a time, and everything
    that counts days (deadlines, expiries, grace periods, how long a
    partner has been waiting, when an action happened) reads it here.
    Dates in the data are literal strings: 'June 11' is 2026,
    'April 2, 2027' carries its year, 'December 2026' is that month's

 var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

 function parseDay(s){ s=String(s||'').trim(); var m=/^([A-Za-z]+)\s+(\d{1,2})(?:,\s*(\d{4}))?(?!\d)/.exec(s); if(m && MON[m[1]]) return Date.UTC(+(m[3]||2026), MON[m[1]]-1, +m[2])/864e5;
   m=/^(\d{1,2})\s+([A-Za-z]+)(?:,?\s*(\d{4}))?(?!\d)/.exec(s); if(m && MON[m[2]]) return Date.UTC(+(m[3]||2026), MON[m[2]]-1, +m[1])/864e5;
   m=/^([A-Za-z]+)\s+(\d{4})$/.exec(s); if(m && MON[m[1]]) return Date.UTC(+m[2], MON[m[1]], 0)/864e5;
   return null }

 function arm(){

 /* ══════════════ MOTION ═══════════════════════════════════════════
    Movement has to explain something or it does not happen. A figure
    the page just computed counts to its value, because watching it
    compute is the point. The map plots in the order the alliances
    joined, which argues "further every year" better than the sentence
    does. Bars grow so a comparison builds rather than arriving drawn.
    Nothing loops, nothing staggers for its own sake, and reduced-motion
    turns all of it off. */
 var MOTION = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);
 function ease(t){ return 1 - Math.pow(1-t, 3) }
 function animate(ms, step){
   if(!MOTION){ step(1); return }
   var t0 = performance.now();
   requestAnimationFrame(function f(now){
     var t = Math.min(1, (now-t0)/ms);
     step(ease(t));
     if(t < 1) requestAnimationFrame(f);
   });
 }
 /* count every [data-to] under root from where it stands to where it lands */
 var COUNTED = {};
 function countUp(root, ms){
   $$('[data-to]', root).forEach(function(e){
     var to = +e.dataset.to, key = e.dataset.k || e.dataset.to,
         from = COUNTED[key] === undefined ? 0 : COUNTED[key],
         fmt = e.dataset.fmt;
     COUNTED[key] = to;
     if(from === to || !MOTION){ e.textContent = fmtNum(to, fmt); return }  /* reduced motion: the figure is simply there */
     animate(ms||700, function(p){ e.textContent = fmtNum(from + (to-from)*p, fmt) });
   });
 }
 function fmtNum(v, fmt){
   if(fmt==='k') return '$'+Math.round(v)+'k';
   if(fmt === 'money') return money(v);
   if(fmt === 'money0') return money(v).replace('$','');
   if(fmt === 'int') return Math.round(v).toLocaleString('en-US');
   return String(Math.round(v));
 }

 function heroArt(){

   var peak=Math.max.apply(null,day), mark=11;

   alOpen:function(b){ SCENE.alOpen = SCENE.alOpen===b.dataset.k ? null : b.dataset.k; drawApp(VIEW); },
   certGroup:function(b){ SCENE.cg = SCENE.cg===b.dataset.g ? null : b.dataset.g; drawApp(VIEW); },
   product:function(b){ SCENE.pk=b.dataset.k; go('product') },
   request:function(b){ SCENE.pk=b.dataset.k; go('request') },
   sendReq:function(){ var ins=$$('.req .gn-in, .gn-ask .gn-in'); SCENE.reqAns=[(ins[0]&&ins[0].value.trim())||'Apple Pay, Google Pay',(ins[1]&&ins[1].value.trim())||'About 400,000']; SCENE.sent=true; mark('sent'); drawApp(VIEW); toast('Request sent') },
   reqStatus:function(){ SCENE.pk='wallet'; go('request') }
 };

 /* ══════════════════════════════════════════════════════════════════
    THE RAIL — ten panels in three acts. A panel is a seat, a stage
    and a screen; stepping through it is the story, and stepping off
    it leaves you in the same prototype with the same state.
    ══════════════════════════════════════════════════════════════════ */
 var showCap=true, seen={};
 var SEATS=['dana'];   /* the seats on screen; more than one on a composite */
 var SCENE={};         /* per-panel interaction state, reset by setPanel */

 /* the three who carry the story, plus the seats the stage brings: Ruth signs at
    stage 4, Hal reads after go-live */
 function seatsAt(st){ return st<2?['dana','marcus']:st===4?['dana','priya','marcus','ruth']:st===6?['dana','priya','marcus','hal']:['dana','priya','marcus'] }

 function setStage(st, sd, vw){
   STAGE=st;
   if(sd) SEAT=sd;
   if(seatsAt(STAGE).indexOf(SEAT)<0) SEAT=seatsAt(STAGE)[0];
   SEATS=[SEAT];
   VIEW = vw || (STAGE<1?'site':(navFor()[0]||['overview'])[0]);
   syncPanel(); repaint(); paintRail(); measure();
 }
 function setSeat(sd){
   if(seatsAt(STAGE).indexOf(sd)<0) return;
   SEAT=sd; SEATS=[sd];
   var nav=navFor().map(function(n){return n[0]});
   if(STAGE>=1 && nav.indexOf(VIEW)<0) VIEW = nav[0];
   syncPanel(); repaint(); paintRail(); measure();
 }
 /* the rail follows you when you wander: the nearest panel with this
    seat and stage lights up, so you always know where you are */
 function syncPanel(){
   /* a seat change inside the same stage stays on the panel you are on: panels 5, 6 and 7 share stage 4, and
      only panel 5 is before the signature (pre() reads PANEL), so falling back to 5 unsigned the agreement
      on panels 6 and 7 whenever a seat was switched (found in the Agent Portal pass, September 7) */
   var cur=PANELS.filter(function(p){ return p.n===PANEL })[0]; if(cur && cur.stage===STAGE) return;
   var m=PANELS.filter(function(p){ return p.stage===STAGE && p.seat===SEAT })[0]
       || PANELS.filter(function(p){ return p.stage===STAGE })[0];
   if(m) PANEL=m.n;
 }
 function setPanel(n){
   var p=PANELS.filter(function(x){return x.n===n})[0]; if(!p) return;
   PANEL=n; seen[n]=1; STAGE=p.stage; SEAT=p.seat; SEATS=p.seats||[p.seat]; VIEW=p.view;
   SCENE={}; showCap=true; sitePage='home';
   /* panel 3 lands on Getting started; the lead tile continues the flow (Rich, September 7) */
   if(n===10){ VIEW='products' } /* the request the narration promises, thirty-two answers already in it */
   var tt=$('#toast'); if(tt){ tt.classList.remove('is-on'); tt.innerHTML='' }
   repaint(); paintRail();
   window.scrollTo(0,0);
 }

 /* the clock: today, a day either way, and a jump to the day the next deadline passes */
 function clock(){
   var n=nextDeadline();
   return '<span class="clk"><span class="gn-num">Today: '+esc(today())+'</span>'
    +'<button class="gn-btn gn-btn--sm" id="clkM" aria-label="A day earlier">−</button>'
    +'<button class="gn-btn gn-btn--sm" id="clkP" aria-label="A day later">+</button>'
    +(n?'<span class="gn-link" id="clkJ" title="'+esc(n.what+', '+dayName(n.day))+'">Skip to '+esc(dayName(n.at))+'</span>':'')
    +(NOW!==DAY0?'<span class="gn-link" id="clk0">Back to '+esc(dayName(DAY0))+'</span>':'')+'</span>';
 }
 function paintRail(){
   var p=PANELS.filter(function(x){return x.n===PANEL})[0]||PANELS[0];
   var can=seatsAt(STAGE);
   var seats=['dana','priya','marcus'].concat(can.filter(function(k){ return ['dana','priya','marcus'].indexOf(k)<0 })).map(function(k){
     var w=PEOPLE[k], on=SEATS.indexOf(k)>-1, ok=can.indexOf(k)>-1;
     return '<span class="p ph2 '+(on?'on':'')+'" data-seat="'+k+'" title="'+esc(w.n+' · '+w.r)+'"'+(ok?'':' style="opacity:.3; cursor:default"')+'>'+av(k,'a26')+'</span>';
   }).join('');
   var acts=ACTS.map(function(a){
     return '<span class="act"><span class="lb" title="'+esc(a.t)+'">Act '+a.n+'<span class="act-t"> · '+esc(a.t)+'</span></span>'
      +PANELS.filter(function(x){return x.act===a.n}).map(function(x){
        return '<span class="p '+(x.n===PANEL?'on':seen[x.n]?'seen':'')+'" data-panel="'+x.n+'" title="'+esc(x.t)+'" role="button" aria-label="Panel '+x.n+', '+esc(x.t)+'"'+(x.n===PANEL?' aria-current="step"':'')+'>'+x.n+'</span>' }).join('')+'</span>';
   }).join('');
   $('#rail').innerHTML=(showCap
     ? '<div class="cap"><span class="t">'+p.n+' · '+esc(p.t)+'</span><span class="d">'+esc(p.d)+' <b style="font-weight:400; color:#fff">'+esc(p.emo)+'</b></span></div>'
     : '')
    +'<div class="who">'+seats+'<div class="n">'+esc(PEOPLE[SEAT].n)+'<span>'+esc(PEOPLE[SEAT].org)+'</span></div></div>'
    +'<div class="acts">'+acts+'</div>'
    +'<div class="nav2"><span class="lnk" id="capT" role="button" tabindex="0" aria-pressed="'+(showCap?'true':'false')+'">'+(showCap?'Hide narration':'Show narration')+'</span>'
    +'<span class="lnk" id="pPrev">← Back</span><span class="lnk" id="pNext">Next →</span></div>';
   /* the clock control left the rail on September 7 (Rich). setNow(), nextDeadline() and DAY0 stay: tools/_r27.js drives them from the console. */
   $$('#rail [data-panel]').forEach(function(a){ a.onclick=function(){ setPanel(+a.dataset.panel) } });
   $$('#rail [data-seat]').forEach(function(a){ a.onclick=function(){ setSeat(a.dataset.seat) } });
   $('#capT').onclick=function(){ showCap=!showCap; paintRail(); measure(); };
   $('#pPrev').onclick=function(){ setPanel(Math.max(1, PANEL-1)) };
   $('#pNext').onclick=function(){ setPanel(Math.min(PANELS.length, PANEL+1)) };
 }
 document.addEventListener('keydown',function(e){
   if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
   if(e.key==='ArrowRight') setPanel(Math.min(PANELS.length, PANEL+1));
   if(e.key==='ArrowLeft') setPanel(Math.max(1, PANEL-1));
 });

 setPanel(1);
 /* a refresh starts the demo at the marketing page (Rich, September 7); the saved session comes back only when the URL says #resume */
 try{ var S0=location.hash==='#resume'?JSON.parse(sessionStorage.getItem('gn.state')||'null'):null; if(S0 && S0.PANEL){ setPanel(S0.PANEL); if(S0.SEAT){ SEAT=S0.SEAT; SEATS=[SEAT] } SCENE=S0.SCENE||{}; if(S0.VIEW) VIEW=S0.VIEW; if(typeof S0.NOW==='number') NOW=S0.NOW; repaint(); paintRail() } }catch(e){}

})();
</script>
