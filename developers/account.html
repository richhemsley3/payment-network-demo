<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account · Discover Global Network</title>
<link rel="stylesheet" href="../design-system/tokens/colors.css">
<link rel="stylesheet" href="../design-system/tokens/typography.css">
<link rel="stylesheet" href="../design-system/tokens/spacing.css">
<link rel="stylesheet" href="../design-system/gn.css">
<link rel="stylesheet" href="shared/site.css">
<script src="../design-system/shared/icons.js"></script>
<script src="shared/story-panels.js"></script>
<script src="shared/account.js"></script>
</head>
<body class="dv">
<div class="dv-shell dv-shell--1"><main class="dv-body">
<div class="dv-h"><div class="gn-eyebrow">Account</div><h1 id="acH">Your account</h1><p id="acP">A preview account, for keys.</p></div>
<div id="acBody"></div>
</main></div>
<script src="shared/site.js"></script>
<script>
(function(){
  var esc=function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') };
  var a=dvAccount(), b=document.getElementById('acBody');
  if(!a){
    document.getElementById('acH').textContent='You do not have an account yet';
    document.getElementById('acP').textContent='The reference, the events, the guides and the shared demo sandbox are public. An account is for your own keys.';
    b.innerHTML='<div class="gn-actions" style="margin-top:24px"><a class="gn-btn gn-btn--primary" href="support.html#signup">Create a preview account</a><a class="gn-link" href="docs/testing.html">Test cards and sandbox</a></div>'
      +'<h2 id="what" style="margin-top:40px">What an account changes</h2>'+grants();
    return;
  }
  document.getElementById('acH').textContent=a.company;
  document.getElementById('acP').textContent='Free account, created '+a.created+'. Sandbox only: certification and production need a participation agreement.';
  b.innerHTML=
    '<h2 id="keys">Your sandbox keys</h2>'
   +'<p>Sandbox keys answer only against test cards. Nothing here moves money.</p>'
   +'<div class="gn-doc" style="margin-top:16px">'
     +row('Publishable key', a.pk)+row('Secret key', a.sk)+row('Webhook endpoint','Not set yet')+row('Signed in as', a.email)
   +'</div>'
   +'<div class="gn-actions" style="margin-top:16px"><a class="gn-link" href="docs/testing.html#console">Send a request with them</a><a class="gn-link" href="docs/webhooks.html">Set a webhook endpoint</a><span class="gn-link" id="acOut" role="button" tabindex="0">Sign out</span></div>'
   +'<h2 id="known" style="margin-top:40px">What the network can see</h2>'
   +'<p>An account is not anonymous. The network holds what you typed and nothing else, and an agent may reach out about certification or production.</p>'
   +'<div class="gn-doc" style="margin-top:16px">'+row('Company', a.company)+row('Work email', a.email)+row('Created', a.created)+'</div>'
   +'<h2 id="what" style="margin-top:40px">What an account changes</h2>'+grants();
  var out=document.getElementById('acOut');
  out.addEventListener('click', function(){ dvSignOut(); location.reload() });
  out.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.click() } });
  function row(l,v){ return '<div class="gn-doc-r"><span class="gn-doc-l">'+esc(l)+'</span><span class="gn-doc-v">'+(/key_|sk_|pk_/.test(v)?'<span class="gn-mono">'+esc(v)+'</span>':esc(v))+'</span></div>' }
  function grants(){ return '<div class="gn-table-wrap"><table class="gn-table"><thead><tr><th>What</th><th>No account</th><th>A preview account</th></tr></thead><tbody>'
    +dvAccountGrants.map(function(g){ return '<tr><td>'+esc(g[0])+'</td><td>'+esc(g[1])+'</td><td>'+esc(g[2])+'</td></tr>' }).join('')+'</tbody></table></div>' }
})();
</script>
</body>
</html>
